oteutunut kate-%:** `SUM(sales_margin_actual) / SUM(total_price) * 100`\n- **Valmistuskustannusten poikkeama:** `SUM(manufacturing_cost_actual) - SUM(manufacturing_cost_planned)`\n- **Toimitusvarmuus:** ajoissa toimitetut tilausrivit / toimitetut tilausrivit\n- **Tuotannon läpimenoaika:** `production_end_date_actual - production_start_date_actual`\n- **Työvaiheen aikataulupitävyys:** ajoissa valmistuneet työvaiheet / valmistuneet työvaiheet\n- **Vaiheajan poikkeama:** `(SUM(phase_duration_stamping_min) - SUM(phase_duration_planned_min)) / SUM(phase_duration_planned_min) * 100`\n- **Hylkäysaste:** `SUM(rejected_qty) / SUM(produced_qty) * 100`\n- **Laatukerroin:** `(SUM(produced_qty) - SUM(rejected_qty)) / SUM(produced_qty) * 100`\n- **Työpisteen suunniteltu kuormitus:** `SUM(phase_duration_planned_min)` ryhmiteltynä työkeskukselle\n- **Työstöajan osuus:** `SUM(machine_active_min) / SUM(duration_min) * 100`\n- **Odotusajan osuus:** `SUM(idle_sum_min) / SUM(duration_min) * 100`\n- **Poikkeama-ajan osuus:** `SUM(exception_min) / SUM(duration_min) * 100`\n- **Energia kappaletta kohti:** `SUM(power_consumption_kwh) / SUM(produced_qty_machine)`, jos energiadata ja konedatan tuotantomäärä ovat luotettavia\n", "links": [], "backlinks": ["/index.md", "/log.md", "/tietomalli.md"]}, {"path": "/tietomalli.md", "reserved": false, "type": "Data Model", "title": "Tuotantotiedon tietomalli", "description": "Konepajan tuotantotiedon dimensiopohjainen tietomalli: kolme faktataulua ja yksitoista ulottuvuustaulua.", "tags": ["tietomalli", "konepaja", "dimensiomallinnus"], "status": "stable", "readiness": "", "unit": "", "grain": "", "metric_id": "", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Yleiskuvaus\n\nTuotantotiedon tietomalli on dimensiopohjainen malli konepajan analytiikkaan ja raportointiin. Se koostuu kolmesta linkittyvästä transaktiomuotoisesta faktataulusta ja niitä täydentävistä ulottuvuustauluista.  Tuotannon läpimenoaika", "description": "Kuinka kauan tilausrivin tuotanto kesti ensimmäisen työvaiheen aloituksesta viimeisen työvaiheen valmistumiseen.", "tags": ["mittari", "aikavertailut"], "status": "stable", "readiness": "direct", "unit": "vrk", "grain": "tilausrivi, työ, nimike, asiakas, kuukausi", "metric_id": "1.1", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka kauan tilausrivin tuotanto kesti ensimmäisen työvaiheen aloituksesta viimeisen työvaiheen valmistumiseen.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | vrk |\n| **Tarkastelutaso** | tilausrivi, työ, nimike, asiakas, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\ndim_date[production_end_date_actual].date_index\n  − dim_date[production_start_date_actual].date_index\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nPäivämääräindeksi(Tuotannon toteutunut lopetus)\n  − Päivämääräindeksi(Tuotannon toteutunut aloitus)\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Sisältää kaiken tuotannossa kuluneen ajan, myös jonotuksen ja odotuksen työvaiheiden välillä.\n- Työpäivinä laskettuna käytä `dim_date.is_workday = TRUE` -rivien lukumäärää välillä; kalenteripäivät ja työpäivät antavat eri tuloksen etenkin lomakausina.\n- Keskeneräiset työt on rajattava pois: `production_end_date_actual IS NOT NULL`.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/aikavertailut/1-14-odotusaika-tyovaiheiden-valilla.md", "/mittarit/aikavertailut/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/aikavertailut/1-02-tuotannon-lapimenoajan-poikkeama.md", "reserved": false, "type": "Metric", iness": "direct", "unit": "vrk", "grain": "tilausrivi, työ, nimike, työkeskus, kuukausi", "metric_id": "1.4", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka monta päivää tuotanto valmistui suunniteltua myöhemmin tai aikaisemmin.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | vrk |\n| **Tarkastelutaso** | tilausrivi, työ, nimike, työkeskus, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\ndate_index(production_end_date_actual) − date_index(production_end_date_planned)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nPäivämääräindeksi(Tuotannon toteutunut lopetus)\n  − Päivämääräindeksi(Tuotannon suunniteltu lopetus)\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Tuotannon valmistumisvarmuus saadaan osuutena: `COUNT(poikkeama <= 0) / COUNT(valmistuneet) * 100`.\n- Mittari kertoo tuotannon sisäisestä suorituskyvystä myös silloin, kun toimituspäivä on edelleen pidossa varastossa tai logistiikassa.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/aikavertailut/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/aikavertailut/1-05-tilauksesta-toimitukseen-kulunut-aika.md", "reserved": false, "type": "Metric", "title": "1.5 Tilauksesta toimitukseen kulunut aika", "description": "Asiakkaan kokema kokonaisläpimenoaika tilauksen luonnista toimitukseen.", "tags": ["mittari", "aikavertailut"], "status": "stable", "readiness": "direct", "unit": "vrk", "grain": "tilausrivi, asiakas, nimike, tilaustyyppi, kuukausi", "metric_id": "1.5", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nAsiakkaan kokema kokonaisläpimenoaika tilauksen luonnista toimitukseen.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | vrk |\n| **Tarkastelutaso** | tilausrivi, asiakas, nimike, tilaustyyppi, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\ndate_index(delivery_date_actual) − date_index(order_created_date)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nPäivämääräindeksi(Toteutunut toimitus) − Päivämääräindeksi(Tilauksen luontipäivä)\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Sisältää myyntikäsittelyn, tuotannon odotuksen, tuotannon ja logistiikan. Logistiikan osuus saadaan erikseen: `date_index(delivery_date_actual) − date_index(dispatch_date_actual)`.\n- Vertailtavuus edellyttää samankaltaisia tuotteita tai ryhmittelyä nimikeryhmittäin.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/aikavertailut/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/aikavertailut/1-06-toimituspoikkeama.md", "reserved": false, "type": "Metric", "title": "1.6 Toimituspoikkeama", "description": "Toteutuneen ja luvatun toimituspäivän eron päivinä.", "tags": ["mittari", "aikavertailut"], "status": "stable", "readiness": "direct", "unit": "vrk", "grain": "tilausrivi, asiakas, nimike, kuukausi", "metric_id": "1.6", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nToteutuneen ja luvatun toimituspäivän eron päivinä.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | vrk |\n| **Tarkastelutaso** | tilausrivi, asiakas, nimike, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\ndate_index(delivery_date_actual) − date_index(delivery_date_planned)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nPäivämääräindeksi(Toteutunut toimitus) − Päivämääräindeksi(Suunniteltu toimitus)\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Positiivinen arvo tulkitaan yleensä myöhästymiseksi.\n- Sama kaava toimii lähetykselle kentillä `dispatch_date_actual` ja `dispatch_date_planned`, jolloin tuotannon ja logistiikan osuudet erottuvat toisistaan.\n- Keskiarvon rinnalla kannattaa seurata myöhästyneiden osuutta ja pahimpia poikkeamia, koska yksittäinen suuri myöhästyminen hukkuu keskiarvoon.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/aikavertailut/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/aikavertailut/1-07-tilausten-toimitusvarmuus.md", "reserved": false, "type": "Metric", "title": "1.7 Tilausten toimitusvarmuus", "description": "Kuinka suuri osa toimitetuista tilausriveistä toimitettiin viimeistään luvattuna päivänä.", "tags": ["mittari", "aikavertailut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "asiakas, nimike, tilaustyyppi, myyjä, viikko, kuukausi", "metric_id": "1.7", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa toimitetuista tilausriveistä toimitettiin viimeistään luvattuna päivänä.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | asiakas, nimike, tilaustyyppi, myyjä, viikko, kuukausi |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (ajoissa-toimituksen määritelmä) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nCOUNT(o - | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | asiakas, nimike, tilaustyyppi, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nCOUNT(order_row_id WHERE delivery_date_actual <= delivery_date_planned\n                     AND delivered_qty >= ordered_qty)\n  / COUNT(order_row_id WHERE delivery_date_actual IS NOT NULL) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nAjallaan ja täysimääräisenä toimitetut tilausrivit / Toimitetut tilausrivit * 100\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Edellyttää, että `delivered_qty` täytetään. Jos kenttä jätetään tyhjäksi, mittari palautuu toimitusvarmuudeksi ([1.7](/mittarit/aikavertailut/1-07-tilausten-toimitusvarmuus.md)).\n- Tietomallissa on yksi rivi tilausriviä kohti, joten osatoimitukset eivät erotu omiksi tapahtumikseen. Osatoimitetun rivin täysimääräisyys näkyy vasta viimeisen toimituserän jälkeen.\n- Jos ylitoimitus on mahdollinen, ehto kannattaa määritellä muotoon `delivered_qty >= ordered_qty` eikä tasan yhtä suureksi.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/mittarit/aikavertailut/1-07-tilausten-toimitusvarmuus.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/aikavertailut/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/aikavertailut/1-09-tyovaiheen-toteutunut-kesto.md", "reserved": false, "type": "Metric", "title": "1.9 Työvaiheen toteutunut kesto", "description": "Kuinka kauan yksittäinen työvaihe kesti aloituksesta valmistumiseen kalenteriaikana.", "tags": ["mittari", "aikavertailut"], "status": "stable", "readiness": "direct", "unit": "min tai h", "grain": "työvaihe, työkeskus, työkeskusryhmä, nimike, käyttäjä", "metric_id": "1.9", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka kauan yksittäinen työvaihe kesti aloituksesta valmistumiseen kalenteriaikana.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | min tai h |\n| **Tarkastelutaso** | työvaihe, työkeskus, työkeskusryhmä, nimike, käyttäjä |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nend_timestamp_actual − start_timestamp_actual\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nLopetus aikaleima toteutunut − Aloitus aikaleima toteutunut\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Ero vaiheaikaan (`phase_duration_*_min`) on olennainen: kesto sisältää tauot ja keskeytykset, vaiheaika vain tehdyn työn. Näiden suhde kertoo, kuinka pirstoutunutta työ on.\n- Jos aikaleimat puuttuvat, karkeampi arvio saadaan päiväavaimista `end_date_actual` ja `start_date_actual`.\n- Alihankintavaiheiden läpimenoaika saadaan rajaamalla `subcontracting_phase = TRUE`, jolloin alihankkijoita voi vertailla `workcenter_id`:n avulla.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/aikavertailut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/aikavertailut/1-10-vaiheajan-poikkeama.md", "reserved": false, "type": "Metric", "title": "1.10 Vaiheajan poikkeama", "description": "Kuinka paljon työvaiheeseen todella kulunut työaika poikkeaa suunnitellusta.", "tags": ["mittari", "aikavertailut"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "työvaihe, työkeskus, työkeskusryhmä, nimike, käyttäjä, kuukausi", "metric_id": "1.10", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka paljon työvaiheeseen todella kulunut työaika poikkeaa suunnitellusta. Yksi käytännöllisimmistä suunnitelma vastaan toteuma -mittareista.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | työvaihe, työkeskus, työkeskusryhmä, nimike, käyttäjä, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\n(SUM(phase_duration_actual_min) − SUM(phase_duration_planned_min))\n  / SUM(phase_duration_planned_min) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\n(Vaiheaika leimattu − Vaiheaika suunniteltu) / Vaiheaika suunniteltu * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Valitse toteumalähde johdonmukaisesti: `phase_duration_stamping_min` tai `phase_duration_machine_min`. Lähteiden ero on itsessään datan laadun mittari ([6.3](/mittarit/datan-laatu/6-03-leimaus-ja-konedatan-poikkeama.md)).\n- Laske vain riveille, joilla suunniteltu aika on suurempi kuin nolla.\n- Erittely asetusaikaan ja tuotantoaikaan tehdään samalla kaavalla kentillä `setup_time_*` ([1.11](/mittarit/aikavertailut/1-11-asetusajan-poikkeama.md)) ja `production_time_*`.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/mittarit/aikavertailut/1-11-asetusajan-poikkeama.md", "/mittarit/datan-laatu/6-03-leimaus-ja-konedatan-poikkeama.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/aikavertailut/index.md", "/mittarit/muut/5-05-tyotuntitehokkuus.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/aikavertailut/1-11-asetusajan-poikkeama.md", "reserved": false, "type": "Metric", "title": "1.11 Asetusajan poikkeama", "description": "Kuinka paljon toteutunut asetustyö poikkeaa suunnitellusta asetusajasta.", "tags": ["mittari", "aikavertailut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "työkeskus, nimike, nimikeryhmä, käyttäjä, vuoro", "metric_id": "1.11", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka paljon toteutunut asetustyö poikkeaa suunnitellusta asetusajasta.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | työkeskus, nimike, nimikeryhmä, käyttäjä, vuoro |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (asetusajan sisältö) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\n(SUM(setup_time_actual_min) − SUM(setup_time_planned_min))\n  / SUM(setup_time_planned_min) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\n(Asetusaika leimattu − Asetusaika suunniteltu) / Asetusaika suunniteltu * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md), tarkempi toteuma [`fact_machine_events`](/taulut/fact_machine_events.md) (`event_type_id = 7`)\n\n# Huomiot ja rajoitteet\n\n- On sovittava, mitä asetusaikaan lasketaan: työkalujen haku, ohjelman lataus, koeajo ja ensimmäisen kappaleen tarkastus voidaan kirjata joko asetukseen tai tuotantoon.\n- Konedatasta johdettu asetusaika on yleensä tarkempi kuin leimattu, koska leimaus tehdään usein jälkikäteen pyöristettynä.\n- Käyttäjäkohtaisessa tarkastelussa tulokset on käsiteltävä ryhmätasolla, ei yksittäisen henkilön arviointiin.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/aikavertailut/1-10-vaiheajan-poikkeama.md", "/mittarit/aikavertailut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/aikavertailut/1-12-tyovaiheiden-aikataulupitavyys.md", "reserved": false, "type": "Metric", "title": "1.12 Työvaiheiden aikataulupitävyys", "description": "Kuinka suuri osa valmistuneista työvaiheista valmistui viimeistään suunniteltuna päivänä.", "tags": ["mittari", "aikavertailut"], "status": "stable", "read one, työvaihe, nimike, päivä |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(produced_qty_stamping) − SUM(produced_qty_machine)\nsekä part_counter-kentän jatkuvuuden tarkistus\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Tuotettu määrä leimausdata) − SUMMA(Tuotettu määrä konedata)\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Ero paljastaa raportointivirheitä molempiin suuntiin: unohtuneita leimauksia tai koneen laskurin laskemia koeajokappaleita.\n- Kappalelaskurin (`part_counter`) nollaukset ja vaihtumiset on käsiteltävä erikseen, muuten erotus antaa virheellisiä arvoja.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/datan-laatu/index.md", "/mittarit/laatu/4-01-hyvaksytty-ja-hylatty-maara.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/datan-laatu/6-05-konetapahtumien-kohdistusaste-tyovaiheisiin.md", "reserved": false, "type": "Metric", "title": "6.5 Konetapahtumien kohdistusaste työvaiheisiin", "description": "Kuinka suuri osa konedatasta on saatu liitettyä työvaiheeseen.", "tags": ["mittari", "datan-laatu"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "kone, tietolähde, tapahtumatyyppi, kuukausi", "metric_id": "6.5", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa konedatasta on saatu liitettyä työvaiheeseen. Rajoittaa suoraan nimike- ja tilauskohtaisen analytiikan luotettavuutta.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, tietolähde, tapahtumatyyppi, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nCOUNT(mach ikate toteutunut)\ntai  SUMMA(Tilausrivi hinta) − SUMMA(Suorat tuotantokustannukset toteutunut)\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md)\n\n# Huomiot ja rajoitteet\n\n- Valitse yksi laskentasääntö ja käytä sitä johdonmukaisesti. Valmiiksi johdettu `sales_margin_actual` ja itse laskettu erotus voivat poiketa toisistaan, jos ERP:n katelaskenta poikkeaa tietomallin kaavasta.\n- Yleiskustannusten kohdistustapa vaikuttaa suoraan siihen, mitkä tilaukset näyttävät kannattavilta. Jos yleiskustannuslisä on kiinteä prosentti, kateprosentti ei kerro todellisesta kustannusrakenteesta.\n- Suunniteltu vastine on `sales_margin_planned`.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/kannattavuus/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/kannattavuus/3-03-kate.md", "reserved": false, "type": "Metric", "title": "3.3 Kate-%", "description": "Katteen osuuden myyntihinnasta.", "tags": ["mittari", "kannattavuus"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "asiakas, nimike, nimikeryhmä, myyjä, tilaustyyppi, kuukausi", "metric_id": "3.3", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKatteen osuuden myyntihinnasta. Mahdollistaa erikokoisten tilausten vertailun.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | asiakas, nimike, nimikeryhmä, myyjä, tilaustyyppi, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(sales_margin_actual) / SUM(total_price) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Myyntikate toteutunut) / SUMMA(Tilausrivi hinta) * 100\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md)\n\n# Huomiot ja rajoitteet\n\n- Laske vain, j , "backlinks": ["/mittarit/kannattavuus/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/kannattavuus/3-14-alihankinnan-osuus-kustannuksista.md", "reserved": false, "type": "Metric", "title": "3.14 Alihankinnan osuus kustannuksista", "description": "Kuinka suuri osa suorista tuotantokustannuksista ostetaan ulkoa.", "tags": ["mittari", "kannattavuus"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "nimike, nimikeryhmä, asiakas, kuukausi", "metric_id": "3.14", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa suorista tuotantokustannuksista ostetaan ulkoa. Taustatieto tee itse vai osta -päätöksille.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | nimike, nimikeryhmä, asiakas, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(subcontracting_cost_actual) / SUM(prime_cost_actual_sum) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Alihankintakustannukset toteutunut)\n  / SUMMA(Suorat tuotantokustannukset toteutunut) * 100\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md)\n\n# Huomiot ja rajoitteet\n\n- Työvaihetasolla vastaava tarkastelu saadaan rajaamalla `subcontracting_phase = TRUE`, jolloin myös alihankinnan läpimenoajat tulevat mukaan.\n- Sisältääkö alihankintakustannus siihen liittyvän logistiikan, on yrityskohtainen ratkaisu ja vaikuttaa vertailtavuuteen.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/kannattavuus/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/kannattavuus/3-15-tilauskannan-arvo-ja-laskuttamaton-valmis-tuotanto.md", "reserved": false, "type": "Metric", "title": "3.15 Tilauskannan arvo ja laskuttamaton valmis tuotanto", "description": "Avoimen tilauskannan arvon sekä sen osan, joka on jo valmistettu mutta laskuttamatta.", "tags": ["mittari", "kannattavuus"], "status": "stable", "readiness": "direct", "unit": "€", "grain": "asiakas, nimike, suunniteltu toimituskuukausi", "metric_id": "3.15", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nAvoimen tilauskannan arvon sekä sen osan, joka on jo valmistettu mutta laskuttamatta.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | € |\n| **Tarkastelutaso** | asiakas, nimike, suunniteltu toimituskuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nTilauskanta          = SUM(total_price) WHERE order_complete = FALSE\nLaskuttamaton valmis = SUM(total_price) WHERE order_complete = FALSE\n                         AND production_end_date_actual IS NOT NULL\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Tilausrivi hinta) rajattuna riveihin, joilla Tilaus valmis = EPÄTOSI\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Tilauskanta kannattaa ryhmitellä suunnitellun toimituspäivän mukaan, jolloin se toimii samalla kuormitusennusteena.\n- Laskuttamaton valmis tuotanto tunnistaa suoraan kassavirtaa hidastavat rivit ja on siksi yksi nopeimmin hyötyä tuottavista mittareista.\n- Edellyttää, että `order_complete` päivitetään luotettavasti.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/kannattavuus/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/kannattavuus/3-16-laskutusviive-ja-maksuaika.md", "reserved": false, "type": "Metric", "title": "3.16 Laskutusviive ja maksuaika", "description": "Kuinka monta päivää kuluu lähetyksestä laskutukseen ja laskutuksesta maksuun.", "tags": ["mittari", "kannattavuus"], "status": "stable", "readiness": "direct", "unit": "vrk", "grain": "asiakas, tilaustyyppi, kuukausi", "metric_id": "3.16", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka monta päivää kuluu lähetyksestä laskutukseen ja laskutuksesta maksuun.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | vrk |\n| **Tarkastelutaso** | asiakas, tilaustyyppi, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nLaskutusviive = date_index(invoice_date_actual) − date_index(dispatch_date_actual)\nMaksuaika     = date_index(payment_date_actual) − date_index(invoice_date_actual)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nPäivämääräindeksi(Lasku lähetyspäivä) − Päivämääräindeksi(Toteutunut lähetys)\nPäivämääräindeksi(Lasku maksupäivä)  − Päivämääräindeksi(Lasku lähetyspäivä)\n```\n\n# Tietolähde\n\n[`fact_order_rows`](/taulut/fact_order_rows.md) + [`dim_date`](/taulut/dim_date.md), ryhmittely [`dim_customer`](/taulut/dim_customer.md)\n\n# Huomiot ja rajoitteet\n\n- Laskutusviive on yrityksen oma sisäinen prosessi ja siten suoraan korjattavissa; maksuaika kuvaa asiakkaan maksukäyttäytymistä.\n- Maksuaika ei ole sama asia kuin maksuehto: erotus näiden välillä on varsinainen ylitys. Maksuehtoa ei ole tietomallissa, joten vertailu vaatii tiedon tuomista erikseen.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_customer.md", "/taulut/dim_date.md", "/taulut/fact_order_rows.md"], "backlinks": ["/mittarit/kannattavuus/index.md", "/taulut/fact_order_rows.md"]}, {"path": "/mittarit/kannattavuus/index.md", "reserved": true, "type": "Index", "title": "index", "description": "", "tags": [], "status": "", "readiness": "", "unit": "", "grain": "", "metric_id": "", "table_name": "", "table_kind": "", "generated": "", "body": "# Kannattavuuden mittarit\n\nKannattavuusmittarit vertaavat tilausrivin myyntihintaa siihen kohdistettuihin kustannuksiin ja suunniteltuja kustannuksia toteutuneisiin. Tietolähteenä on pääosin `fact_order_rows`, työvaihetason kustannukset `fact_workphases`-taulusta. Ryhmittelyt tehdään `dim_customer`-, `dim_article`- ja `dim_user`-taulujen kautta.\n\nKaikissa katemittareissa on ensin päätettävä kustannustaso, koska tietomalli tarjoaa niitä kolme:\n\n```text\nprime_cost_*_sum       : välittömät kustannukset ilman yleiskustannuslisää\nmanufacturing_cost_*   : omakustannus, sisältää yleiskustannukset\nprofit_*               : voitto kaikkien kustannusten jälkeen\n```\n\n# Mittarit\n\n* [3.1 Myynti](3-01-myynti.md) - Tilausrivien yhteenlasketun arvon ilman arvonlisäveroa.\n* [3.2 Toteutunut kate](3-02-toteutunut-kate.md) - Tilausrivin euromääräisen kannattavuuden valitulla kustannustasolla.\n* [3.3 Kate-%](3-03-kate.md) - Katteen osuuden myyntihinnasta.\n* [3.4 Katepoikkeama](3-04-katepoikkeama.md) - Toteutuneen ja suunnitellun katteen eron euroina ja prosenttiyksikköinä.\n* [3.5 Jälkilaskennan poikkeama](3-05-jalkilaskennan-poikkeama.md) - Toteutuneiden ja suunniteltujen suorien tuotantokustannusten eron.\n* [3.6 Jälkilaskennan poikkeamaprosentti](3-06-jalkilaskennan-poikkeamaprosentti.md) - Kustannuspoikkeaman suhteessa suunniteltuun kustannukseen.\n* [3.7 Kustannuslajikohtainen poikkeama](3-07-kustannuslajikohtainen-poikkeama.md) - Mistä kustannuslajista kustannuspoikkeama syntyy: työstä, materiaalista, alihankinnasta vai muista suorista kuluista.\n* [3.8 Kappalekohtainen valmistuskustannus](3-08-kappalekohtainen-valmistuskustannus.md) - Yhden valmistetun kappaleen kustannuksen.\n* [3.9 Voittolisä-%](3-09-voittolisa.md) - Voiton osuuden omakustannusarvosta.\n* [3.10 Tuntikate](3-10-tuntikate.md) - Kuinka paljon katetta työ tuotti käytettyä tuotantotuntia kohti.\n* [3.11 Asetuskustan n-kate.md", "/mittarit/kannattavuus/3-13-vaihekustannuksen-poikkeama.md", "/mittarit/kannattavuus/3-14-alihankinnan-osuus-kustannuksista.md", "/mittarit/kannattavuus/3-15-tilauskannan-arvo-ja-laskuttamaton-valmis-tuotanto.md", "/mittarit/kannattavuus/3-16-laskutusviive-ja-maksuaika.md"], "backlinks": ["/index.md", "/mittarit/index.md"]}, {"path": "/mittarit/laatu/4-01-hyvaksytty-ja-hylatty-maara.md", "reserved": false, "type": "Metric", "title": "4.1 Hyväksytty ja hylätty määrä", "description": "Valmistuneiden ja hylättyjen kappaleiden määrät, joista muut laatumittarit johdetaan.", "tags": ["mittari", "laatu"], "status": "stable", "readiness": "direct", "unit": "kpl", "grain": "työvaihe, työkeskus, nimike, käyttäjä, vuoro, päivä", "metric_id": "4.1", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nValmistuneiden ja hylättyjen kappaleiden määrät, joista muut laatumittarit johdetaan.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | kpl |\n| **Tarkastelutaso** | työvaihe, työkeskus, nimike, käyttäjä, vuoro, päivä |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nHylätty määrä    = SUM(rejected_qty)\nHyväksytty määrä = SUM(produced_qty) − SUM(rejected_qty)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Hylätty määrä)\nSUMMA(Tehty määrä) − SUMMA(Hylätty määrä)\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md), konetapahtumatasolla `produced_qty_stamping` ja `rejected_qty_stamping`\n\n# Huomiot ja rajoitteet\n\n- Konetapahtumatasolla hylkäysmäärä on määritelty leimausperusteiseksi. Jos tuotantomäärä otetaan konedatasta (`produced_qty_machine`), lähteet on syytä pitää mielessä tulkinnassa.\n- Työvaihetason ja konetapahtumatason määrien ero on datan laadun mittari ([6.4](/mittarit/datan-laatu/6-04-kappalemaarien-ristiintarkistus.md)).\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/mittarit/datan-laatu/6-04-kappalemaarien-ristiintarkistus.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/laatu/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/laatu/4-02-hylkaysaste.md", "reserved": false, "type": "Metric", "title": "4.2 Hylkäysaste", "description": "Hylättyjen kappaleiden osuuden valmistetuista.", "tags": ["mittari", "laatu"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "nimike, nimikeryhmä, työvaihe, työkeskus, käyttäjä, vuoro, kuukausi", "metric_id": "4.2", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nHylättyjen kappaleiden osuuden valmistetuista. Laadun perusmittari.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | nimike, nimikeryhmä, työvaihe, työkeskus, käyttäjä, vuoro, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(rejected_qty) / SUM(produced_qty) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Hylätty määrä) / SUMMA(Tehty määrä) * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + [`dim_article`](/taulut/dim_article.md), [`dim_workcenter`](/taulut/dim_workcenter.md), [`dim_time`](/taulut/dim_time.md)\n\n# Huomiot ja rajoitteet\n\n- Ryhmittely vaihenumeron mukaan paljastaa, missä kohtaa prosessia hylkyjä syntyy; ryhmittely nimikkeen mukaan sen, mitkä tuotteet ovat vaikeita.\n- Myöhäisessä työvaiheessa hylätty kappale on huomattavasti kalliimpi kuin alkuvaiheessa hylätty. Pelkkä kappalemääräinen osuus ei kerro tätä, joten sen rinnalle sopii mittari 4.7.\n- Ei erottele romutettavaa ja korjattavaa kappaletta.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_article.md", "/taulut/dim_time.md", "/taulut/dim_workcenter.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/laatu/4-03-laatukerroin-ja-hyvaksymisaste.md", "/mittarit/laatu/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/laatu/4-03-laatukerroin-ja-hyvaksymisaste.md", "reserved": false, "type": "Metric", "title": "4.3 Laatukerroin ja hyväksymisaste", "description": "Hyväksyttyjen kappaleiden osuuden valmistetuista.", "tags": ["mittari", "laatu"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "nimike, työvaihe, työkeskus, vuoro, kuukausi", "metric_id": "4.3", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nHyväksyttyjen kappaleiden osuuden valmistetuista. Sama peruslogiikka kuin OEE:n laatukomponentissa.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | nimike, työvaihe, työkeskus, vuoro, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\n(SUM(produced_qty) − SUM(rejected_qty)) / SUM(produced_qty) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\n(SUMMA(Tehty määrä) − SUMMA(Hylätty määrä)) / SUMMA(Tehty määrä) * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Täydentää hylkäysastetta ([4.2](/mittarit/laatu/4-02-hylkaysaste.md)): mittarit summautuvat sataan, joten kumpikin riittää raportille. Valinta on esitystapakysymys.\n- Tarkastettujen kappaleiden määrää ei ole erikseen, joten hyväksymisaste lasketaan tuotetuista kappaleista. Jos kaikkia kappaleita ei tarkasteta, mittari kuvaa tuotantoa, ei tarkastusta.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/mittarit/laatu/4-02-hylkaysaste.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/laatu/index.md", "/taulut/fact_workphases.md"]}, {"path": nd": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nValmistuneen tuotannon suunnitellun työmäärän. Tekee monituoteympäristön tuotannon vertailukelpoiseksi.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | standardih/jakso |\n| **Tarkastelutaso** | työkeskus, työkeskusryhmä, vuoro, viikko, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(produced_qty * unit_time_planned_min) / 60\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Tehty määrä * Kappaleaika suunniteltu) / 60\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Standardiaika on tässä suunniteltu kappaleaika. Jos suunnitteluarvot ovat vanhentuneet, mittari kuvaa vanhaa standardia eikä todellista työmäärää.\n- Sopii tuottavuuden aikasarjaseurantaan paremmin kuin kappalemäärä.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/5-01-tuotantomaara.md", "/mittarit/muut/5-04-tyon-tuottavuus.md", "/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-03-lapaisykyky.md", "reserved": false, "type": "Metric", "title": "5.3 Läpäisykyky", "description": "Kuinka nopeasti hyväksyttyjä kappaleita valmistuu.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "kpl/h", "grain": "työkeskus, nimike, työvaihe, vuoro", "metric_id": "5.3", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka nopeasti hyväksyttyjä kappaleita valmistuu.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | kpl/h |\n| **Tarkastelutaso** | työkeskus, nimike, työvaihe, vuoro |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä ke phases.md)\n\n# Huomiot ja rajoitteet\n\n- Kustannusperusteinen arvo ei ole varsinainen varastoarvo, koska keskeneräisyyden aste ei ole tiedossa. Tarkempi arvio saadaan laskemalla valmistuneiden vaiheiden osuus työn kaikista vaiheista.\n- Jäljellä olevina standarditunteina mitattuna keskeneräinen tuotanto on suoraan verrattavissa työjonon kuormitukseen ([5.9](/mittarit/muut/5-09-tyojonon-kuormitus.md)).\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/mittarit/muut/5-09-tyojonon-kuormitus.md", "/taulut/fact_order_rows.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_order_rows.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-07-tyovaiheen-kuormitus.md", "reserved": false, "type": "Metric", "title": "5.7 Työvaiheen kuormitus", "description": "Yksittäisen työvaiheen vaatiman kapasiteetin.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "min tai h", "grain": "työvaihe, työ, tilausrivi", "metric_id": "5.7", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nYksittäisen työvaiheen vaatiman kapasiteetin.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | min tai h |\n| **Tarkastelutaso** | työvaihe, työ, tilausrivi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nsetup_time_planned_min + planned_qty * cycle_time_planned_min\ntai suoraan phase_duration_planned_min\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nAsetusaika suunniteltu + Suunniteltu määrä * Kappale jaksoaika suunniteltu\ntai Vaiheaika suunniteltu\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Molempien laskentatapojen pitäisi antaa sama tulos. Ero kertoo, että `phase_duration_planned_min` on johdettu jollain muulla säännöllä \n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/dim_workcenter.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-09-tyojonon-kuormitus.md", "reserved": false, "type": "Metric", "title": "5.9 Työjonon kuormitus", "description": "Aloittamattomien ja keskeneräisten työvaiheiden jäljellä olevan työmäärän työkeskuksittain.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "standardih", "grain": "työkeskus, työkeskusryhmä, viikko", "metric_id": "5.9", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nAloittamattomien ja keskeneräisten työvaiheiden jäljellä olevan työmäärän työkeskuksittain.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | standardih |\n| **Tarkastelutaso** | työkeskus, työkeskusryhmä, viikko |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(phase_duration_planned_min) WHERE end_date_actual IS NULL\n  GROUP BY workcenter_id\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Vaiheaika suunniteltu) avoimille työvaiheille ryhmiteltynä Työkeskus ID\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + [`dim_workcenter`](/taulut/dim_workcenter.md)\n\n# Huomiot ja rajoitteet\n\n- Osittain aloitetuista vaiheista kannattaa vähentää jo toteutunut aika, muuten jono näyttää todellista pidemmältä.\n- Työjonon koko yhdessä sen kehityssuunnan kanssa ennakoi ruuhkautumista aikaisemmin kuin toimitusvarmuus.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_workcenter.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/5-06-keskeneraisen-tuotannon-maara-ja-arvo.md", "/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-10-myohassa-olevan-kuorman-osuus.md", "reserved": false, "type": "Metric", "title": "5.10 Myöhässä olevan kuorman osuus", "description": "Kuinka suuri osa työjonosta on jo myöhässä suunnitellusta valmistumisesta.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "työkeskus, työkeskusryhmä, asiakas", "metric_id": "5.10", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa työjonosta on jo myöhässä suunnitellusta valmistumisesta. Toimitusriskin ennakoiva mittari.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | työkeskus, työkeskusryhmä, asiakas |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(phase_duration_planned_min) WHERE end_date_latest_planned < tarkastelupäivä\n                                  AND end_date_actual IS NULL\n  / Työjonon kuormitus * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nMyöhässä olevien avoimien työvaiheiden kuormitus / Työjonon kuormitus * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Mittari on tilannekuva, ei jaksomittari. Se lasketaan aina tarkasteluhetkeen nähden.\n- Suuri arvo yhdellä työkeskuksella tunnistaa pullonkaulan nopeammin kuin kuormitusaste, joka vaatii kapasiteettitiedon.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-11-kuormitusaste.md", "reserved": false, "type": "Metric", "title": "5.11 Kuormitusaste", "description": "Kuinka suuri osa käytettävissä olevasta kapasiteetista on suunniteltu käytettäväksi.", "tags": ["mittari", "muut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "työkeskus, työkeskusryhmä, viikko, kuukausi", "metric_id": "5.11", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa käytettävissä olevasta kapasiteetista on suunniteltu käytettäväksi.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | työkeskus, työkeskusryhmä, viikko, kuukausi |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (tehollinen kapasiteetti) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nTyöpisteen kokonaiskuormitus / Tehollinen kapasiteetti * 100\n  Tehollinen kapasiteetti = SUM(duration_min) WHERE event_type_id = 19\n                            tai erillinen kapasiteettiparametri\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSuunniteltu kuormitus / Tehollinen kapasiteetti * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + [`fact_machine_events`](/taulut/fact_machine_events.md) (`event_type_id = 19`)\n\n# Huomiot ja rajoitteet\n\n- Tietomallissa ei ole työkeskuskohtaista kapasiteetti- tai työvuorokalenteria. Kapasiteetti saadaan joko suunnitellun tuotantoajan riveistä tai tuomalla se parametrina (vuorojen määrä × vuoron pituus × koneiden määrä − suunnitellut menetykset).\n- Kuormituksen ja kapasiteetin on oltava samalla aikajaksotuksella ja samassa yksikössä, muuten mittari ei ole tulkittavissa.\n- Yli 100 %:n kuormitusaste ei tarkoita ylityötä vaan sitä, että suunnitelma ei mahdu kapasiteettiin. Se on suunnitteluvirhe, joka kannattaa nostaa esiin.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-12-vapaa-kapasiteetti-tai-kapasiteettivaje.md", "reserved": false, "type": "Metric", "title": "5.12 Vapaa kapasiteetti tai kapasiteettivaje", "description": "Kapasiteetin ja kuormituksen erotuksen.", "tags": ["mittari", "muut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "h tai standardih; osuus %", "grain": "työkeskus, työkeskusryhmä, viikko", "metric_id": "5.12", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKapasiteetin ja kuormituksen erotuksen. Kertoo, voidaanko uusia töitä ottaa vastaan.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | h tai standardih; osuus % |\n| **Tarkastelutaso** | työkeskus, työkeskusryhmä, viikko |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (tehollinen kapasiteetti) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nTehollinen kapasiteetti − Työpisteen kokonaiskuormitus\nPuskurin osuus = (Tehollinen kapasiteetti − kuormitus) / Tehollinen kapasiteetti * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nTehollinen kapasiteetti − Suunniteltu kuormitus\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + kapasiteettitieto\n\n# Huomiot ja rajoitteet\n\n- Negatiivinen arvo on kapasiteettivaje.\n- Kapasiteettipuskuri on tarkoituksellinen: täyteen kuormitettu tuotanto ei kestä häiriöitä eikä kiiretöitä. Tavoitetaso on päätettävä, tietomalli ei sitä sisällä.\n- Pullonkaulaksi tunnistetun työkeskuksen marginaali on tärkein yksittäinen luku toimituskyvyn ennakoinnissa.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-13-kuormitushorisontti.md", "reserved": false, "type": "Metric", "title": "5.13 Kuormitushorisontti", "description": " "body": "\n# Määritelmä\n\nHistoriatiedon perusteella todella saavutetun kapasiteetin. Toimii tehollisen kapasiteetin realistisuustarkistuksena.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | standardih/jakso |\n| **Tarkastelutaso** | työkeskus, työkeskusryhmä, viikko, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nAVG(SUM(produced_qty * unit_time_planned_min)) valituilta vertailujaksoilta\n  GROUP BY workcenter_id, jakso\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nKESKIARVO(jakson toteutunut tuotanto standarditunteina)\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Ei vaadi kapasiteettiparametria, joten tämä on käytännöllisin kapasiteettimittari ennen kapasiteettikalenterin lisäämistä.\n- Vertailujaksot on valittava edustaviksi: lomakaudet ja poikkeukselliset ruuhkat vääristävät keskiarvoa.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-15-tyokeskusryhman-kuormitustasapaino.md", "reserved": false, "type": "Metric", "title": "5.15 Työkeskusryhmän kuormitustasapaino", "description": "Kuinka tasaisesti kuorma jakautuu ryhmän koneiden kesken.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "h tai %", "grain": "työkeskusryhmä, viikko, kuukausi", "metric_id": "5.15", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka tasaisesti kuorma jakautuu ryhmän koneiden kesken.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | h tai % |\n| **Tarkastelutaso** | työkeskusryhmä, viikko, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSTDDEV(kuormitus) GROUP BY workcenter_group_id\n  tai (MAX(kuormitus) − MIN(kuormitus)) / AVG(kuormitus) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nTyökeskusten kuormitusten hajonta ryhmiteltynä Työkeskusryhmä ID\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md) + [`dim_workcenter_group`](/taulut/dim_workcenter_group.md)\n\n# Huomiot ja rajoitteet\n\n- Mielekäs vain, jos ryhmän koneet ovat aidosti keskenään vaihtoehtoisia. Jos koneilla on eri kyvykkyydet, epätasapaino on väistämätön eikä kerro suunnittelusta.\n- Kertoo hienokuormituksen toimivuudesta nopeammin kuin yksittäisen koneen kuormitusaste.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_workcenter_group.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_workphases.md"]}, {"path": "/mittarit/muut/5-16-poikkeamien-maara-ja-keskimaarainen-kesto.md", "reserved": false, "type": "Metric", "title": "5.16 Poikkeamien määrä ja keskimääräinen kesto", "description": "Kuinka usein häiriöitä esiintyy ja kuinka kauan ne kestävät.", "tags": ["mittari", "muut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "kpl, min ja min/poikkeama", "grain": "kone, työkeskusryhmä, poikkeamatyyppi, vuoro, kuukausi", "metric_id": "5.16", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka usein häiriöitä esiintyy ja kuinka kauan ne kestävät.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | kpl, min ja min/poikkeama |\n| **Tarkastelutaso** | kone, työkeskusryhmä, poikkeamatyyppi, vuoro, kuukausi |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (poikkeamien luokittelu) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nMäärä         = COUNT(machine_event_id) WHERE event_type_id IN (4, 15)\nKokonaisaika  = SUM(exception_min)\nKeskim. kesto = SUM(exception_min) / COUNT(poikkeamat)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nPoikkeamatapahtumien lukumäärä, SUMMA(Poikkeama min) ja niiden osamäärä\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md) + [`dim_exception`](/taulut/dim_exception.md), [`dim_event_type`](/taulut/dim_event_type.md)\n\n# Huomiot ja rajoitteet\n\n- Konetapahtumataulun poikkeamat ovat koneen häiriötiloja, eivät kunnossapidon vikailmoituksia. Mittari kuvaa tuotannon menetettyä aikaa, ei korjausaikaa, joten se ei ole varsinainen MTBF tai MTTR.\n- Kunnossapidon näkökulmasta lasketut vastineet (häiriöiden välinen käyntiaika `SUM(machine_active_min) / poikkeamien määrä`) ovat käyttökelpoisia vain, jos `dim_exception.exception_type` erottelee todelliset viat muista poikkeamista.\n- Pareto-analyysi `exception_id`-kentän kautta kohdistaa kehitystyön tehokkaimmin.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_event_type.md", "/taulut/dim_exception.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/muut/5-17-suunnittelemattomien-seisokkien-osuus.md", "reserved": false, "type": "Metric", "title": "5.17 Suunnittelemattomien seisokkien osuus", "description": "Vikojen ja muiden ennakoimattomien häiriöiden osuuden suunnitellusta tuotantoajasta.", "tags": ["mittari", "muut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "kone, työkeskusryhmä, vuoro, kuukausi", "metric_id": "5.17", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nVikojen ja muiden ennakoimattomien häiriöiden osuuden suunnitellusta tuotantoajasta.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, työkeskusryhmä, vuoro, kuukausi |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (suunnittelemattoman seisokin rajaus) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(exception_min + undefined_idle_min) / Suunniteltu tuotantoaika * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Poikkeama min + Muu odotusaika min) / Suunniteltu tuotantoaika * 100\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Kohdistamaton tyhjäkäynti (`undefined_idle_min`) ei ole automaattisesti suunnittelematon seisokki. Sen sisällyttäminen on määrittelykysymys ja vaikuttaa lukuun merkittävästi.\n- Häiriösyyt on kirjattava vakioluokituksella, muuten mittari ei ohjaa toimenpiteisiin.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/muut/5-18-yllapitoajan-osuus.md", "reserved": false, "type": "Metric", "title": "5.18 Ylläpitoajan osuus", "description": "Huoltoon ja ylläpitoon kuluneen ajan osuuden.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "% (myös min tai h absoluuttisena)", "grain": "kone, työkeskusryhmä, kuukausi, vuosi", "metric_id": "5.18", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nHuoltoon ja ylläpitoon kuluneen ajan osuuden.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % (myös min tai h absoluuttisena) |\n| **Tarkastelutaso** | kone, työkeskusryhmä, kuukausi, vuosi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(duration_min) WHERE event_type_id = 5\n  / SUM(duration_min) * 100\n```\n\nS er_consumption_kwh) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Energiankulutus kWh) sekä sen suhde\n  Tuotettu määrä konedata -kenttään ja Työstöaika min -kenttään\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Edellyttää, että `power_consumption_kwh` on täytetty luotettavasti; kaikilla koneilla mittausta ei ole.\n- Käytä leimausperusteista tuotantomäärää, jos konedatan määrä ei ole luotettava.\n- Energiakustannus (`kulutus × sähkön yksikköhinta`) edellyttää hintatiedon tuomista erikseen, sitä ei ole tietomallissa.\n- Tyhjäkäynnin energiaosuus tukee sammutuskäytäntöjen kehittämistä ja täydentää sammutusajan tarkastelua.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/muut/5-20-miehittamattoman-ajon-osuus.md", "reserved": false, "type": "Metric", "title": "5.20 Miehittämättömän ajon osuus", "description": "Kuinka suuri osa koneajasta ajetaan ilman käyttäjää.", "tags": ["mittari", "muut", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "kone, työkeskusryhmä, vuoro, kuukausi", "metric_id": "5.20", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa koneajasta ajetaan ilman käyttäjää. Automaatioasteen seurantamittari.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, työkeskusryhmä, vuoro, kuukausi |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (läsnäolotiedon keruu) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(machine_active_min) ilman päällekkäistä event_type_id = 18 -jaksoa\n  / SUM(machine_active_min) * 100\n```\n\nSama kaava semantti events.md) + [`dim_time`](/taulut/dim_time.md), [`dim_user`](/taulut/dim_user.md)\n\n# Huomiot ja rajoitteet\n\n- Käyttäjätason tuloksia käsitellään ryhmätasolla ja perehdytyksen kohdentamiseen, ei henkilöarviointiin. Tämä on syytä sopia ennen mittarin käyttöönottoa.\n- Vuorojen väliset erot selittyvät usein työn sisällöstä, eivät suorituksesta. Vertailu edellyttää samankaltaista työkantaa, esimerkiksi rajausta samaan nimikkeeseen.\n- Vuorotieto on käytettävissä vain, jos `dim_time.shift_id` on täytetty.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_time.md", "/taulut/dim_user.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/muut/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/muut/5-22-uusien-nimikkeiden-osuus-ja-kustannuspoikkeama.md", "reserved": false, "type": "Metric", "title": "5.22 Uusien nimikkeiden osuus ja kustannuspoikkeama", "description": "Kuinka suuri osa tuotannosta on uustuotantoa ja kuinka paljon heikommin kustannusarviot osuvat siinä.", "tags": ["mittari", "muut"], "status": "stable", "readiness": "direct", "unit": "% ja %-yks.", "grain": "nimike, asiakas, myyjä, kuukausi", "metric_id": "5.22", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa tuotannosta on uustuotantoa ja kuinka paljon heikommin kustannusarviot osuvat siinä.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % ja %-yks. |\n| **Tarkastelutaso** | nimike, asiakas, myyjä, kuukausi |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nOsuus       = COUNT(order_row_id WHERE new_article = TRUE) / COUNT(order_row_id) * 100\nPoikkeamaero = Jälkilaskennan poikkeama-% (new_article = TRUE)\n                 − Jälkilaskennan poikkeama-% (new_article = FALSE)\n```\n\nSama kaava semanttisilla nimillä act_machine_events.md"]}, {"path": "/mittarit/oee/2-06-laatukerroin.md", "reserved": false, "type": "Metric", "title": "2.6 Laatukerroin", "description": "Hyväksyttyjen kappaleiden osuuden kaikista valmistetuista.", "tags": ["mittari", "oee"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "kone, nimike, työvaihe, vuoro, käyttäjä", "metric_id": "2.6", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nHyväksyttyjen kappaleiden osuuden kaikista valmistetuista. OEE:n kolmas osatekijä.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, nimike, työvaihe, vuoro, käyttäjä |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\n(SUM(produced_qty_machine) − SUM(rejected_qty_stamping))\n  / SUM(produced_qty_machine) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\n(Tuotettu määrä konedata − Hylätty määrä kpl) / Tuotettu määrä konedata * 100\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md), työvaihetasolla [`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Tietomalli ei erottele korjattuja kappaleita hyväksytyistä, joten arvo on lievästi optimistinen suhteessa OEE:n suositeltuun määritelmään, jossa hyväksytty on ensimmäisellä kerralla onnistunut kappale.\n- Jos tuotantomäärä ja hylkäysmäärä tulevat eri lähteestä (konedata ja leimaus), niiden rajausten on vastattava toisiaan. Muuten kerroin vääristyy.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-07-oee-kokonaistehokkuus.md", "reserved": false, "type": "Metric", "title": "2.7 OEE, kokonaistehokkuus", "description": ttarit/datan-laatu/6-08-ihannesykliajan-kattavuus.md", "/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-08-taysin-tuottava-aika.md", "reserved": false, "type": "Metric", "title": "2.8 Täysin tuottava aika", "description": "Ajan, joka olisi tavoitenopeudella tarvittu hyväksyttyjen kappaleiden valmistamiseen.", "tags": ["mittari", "oee", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "min tai h", "grain": "kone, nimike, päivä, viikko", "metric_id": "2.8", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nAjan, joka olisi tavoitenopeudella tarvittu hyväksyttyjen kappaleiden valmistamiseen. OEE:n aikatulkinta.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | min tai h |\n| **Tarkastelutaso** | kone, nimike, päivä, viikko |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (ihannesykliaika) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(Hyväksytty määrä * cycle_time_ideal_min)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Hyväksytty määrä * Kappale jaksoaika tavoite)\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md) + [`fact_workphases`](/taulut/fact_workphases.md)\n\n# Huomiot ja rajoitteet\n\n- Erotus suunniteltuun tuotantoaikaan on menetetty aika minuutteina, mikä on usein havainnollisempi luku kuin OEE-prosentti.\n- Sopii hyvin OEE:n visualisointiin vesiputouskaaviona: suunniteltu aika, seisokkihäviö, nopeushäviö, laatuhäviö, jäljelle jäävä tuottava aika.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-09-koneen-kayttoaste.md", "reserved": false, "type": "Metric", "title": "2.9 Koneen käyttöaste", "description": "Kuinka suuren osan tarkastelujakson kalenteriajasta kone oli käynnissä.", "tags": ["mittari", "oee", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "kone, työkeskus, työkeskusryhmä, kuukausi, vuosi", "metric_id": "2.9", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuren osan tarkastelujakson kalenteriajasta kone oli käynnissä. Kapasiteetti- ja investointitarkastelun mittari.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, työkeskus, työkeskusryhmä, kuukausi, vuosi |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (vertailuajan rajaus) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(machine_active_min) / (tarkastelujakson päivien määrä * 1440) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Työstöaika min) / (Jakson päivät * 1440) * 100\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md) + [`dim_date`](/taulut/dim_date.md)\n\n# Huomiot ja rajoitteet\n\n- Vertailuaika on valittava: koko kalenteriaika, työpäivät (`is_workday = TRUE`) tai vuorojen mukainen aika. Luvut eivät ole vertailukelpoisia keskenään.\n- Matala käyttöaste ei sinänsä ole ongelma, jos konetta ei ole tarkoitettukaan käytettäväksi ympärivuorokautisesti. Mittari kertoo investoinnin hyödyntämisestä, ei tuotannon sujuvuudesta.\n- Sammutusajan osuus saadaan vastaavasti kentästä `power_off_min`; se kertoo miehittämättömän ajon potentiaalista.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/dim_date.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/oee/2-04-kaytettavyys.md", "/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-10-lastuamisaste.md", "reserved": false, "type": "Metric", "title": "2.10 Lastuamisaste", "description": "Kuinka suuri osa aktiivisesta koneajasta on todellista lastuamista.", "tags": ["mittari", "oee"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "kone, nimike, ohjelma, työvaihe", "metric_id": "2.10", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa aktiivisesta koneajasta on todellista lastuamista. Yksi konedatan tuomista merkittävimmistä lisistä.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, nimike, ohjelma, työvaihe |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(cutting_time_min) / SUM(machine_active_min) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Lastuamisaika min) / SUMMA(Työstöaika min) * 100\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Edellyttää, että lastuamisaika saadaan koneen rajapinnasta tai anturidatasta. Leimausdatasta sitä ei voi johtaa.\n- Ohjelmakohtainen tarkastelu (`program_name`) kohdistaa NC-ohjelmien optimointia suoraan sinne, missä hyöty on suurin.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/oee/2-11-apuajan-osuus.md", "/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-11-apuajan-osuus.md", "reserved": false, "type": "Metric", "title": "2.11 Apuajan osuus", "description": "Aktiivisen työstön aikana kuluneen ei-lastuavan ajan osuuden.", "tags": ["mittari", "oee"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "kone, nimike, ohjelma, työvaihe", "metric_id": "2.11", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 20 kone, nimike, nimikeryhmä, eräkoko, vuoro |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nAsetusajan osuus = SUM(setup_time_min) / SUM(duration_min) * 100\nVaihtoajan osuus = SUM(part_change_time_min) / SUM(duration_min) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nAsetusajan osuus = SUMMA(Asetusaika min) / SUMMA(Kesto min) * 100\nVaihtoajan osuus = SUMMA(Vaihtoaika min) / SUMMA(Kesto min) * 100\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Ryhmittely eräkoon mukaan (`planned_qty` työvaihetaulusta) tekee näkyväksi, missä eräkoossa asetusten osuus muuttuu kohtuuttomaksi. Tämä kytkeytyy suoraan kannattavuusmittariin 3.11.\n- Vaihtoaika on kohdistettavissa kiinnitin- ja automaatiokehitykseen; asetusaika taas SMED-tyyppiseen kehitystyöhön.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-13-tehottoman-ajon-osuus.md", "reserved": false, "type": "Metric", "title": "2.13 Tehottoman ajon osuus", "description": "Kuinka suuri osa koneen käyntiajasta ajetaan alennetulla teholla.", "tags": ["mittari", "oee", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "kone, nimike, ohjelma, vuoro", "metric_id": "2.13", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka suuri osa koneen käyntiajasta ajetaan alennetulla teholla. Kone käy, mutta ei tavoitenopeudella.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, nimike, ohjelma, vuoro |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (tehokkaan ajon raja) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nSUM(inefficient_production_min)\n  / (SUM(efficient_production_min) + SUM(inefficient_production_min)) * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nSUMMA(Tehoton työstöaika min)\n  / (SUMMA(Tehokas työstöaika min) + SUMMA(Tehoton työstöaika min)) * 100\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Tehokkaan ja tehottoman ajon raja on määriteltävä konekohtaisesti, esimerkiksi karan kuormituksen tai syöttönopeuden perusteella. Ilman yhtenäistä sääntöä koneita ei voi verrata keskenään.\n- Selittää usein OEE:n nopeushäviön syyn tarkemmin kuin nopeuskomponentti yksinään.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-14-prosenttikytkinten-keskiarvo.md", "reserved": false, "type": "Metric", "title": "2.14 Prosenttikytkinten keskiarvo", "description": "Kuinka paljon koneenkäyttäjät poikkeavat ohjelmoidusta syötöstä ja karannopeudesta.", "tags": ["mittari", "oee"], "status": "stable", "readiness": "direct", "unit": "%", "grain": "kone, ohjelma, nimike, käyttäjä, vuoro", "metric_id": "2.14", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka paljon koneenkäyttäjät poikkeavat ohjelmoidusta syötöstä ja karannopeudesta.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | kone, ohjelma, nimike, käyttäjä, vuoro |\n| **Tila** | Laskettavissa suoraan |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\nAVG(feed_override), AVG(spindle_override)\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\nKESKIARVO(Syötön prosenttikytkin), KESKIARVO(Karan prosenttikytkin)\n```\n\n# Tietolähde\n\n[`fact_machine_events`](/taulut/fact_machine_events.md)\n\n# Huomiot ja rajoitteet\n\n- Systemaattisesti alle 100 % oleva arvo viittaa ohjelmointi-, työkalu- tai luottamusongelmaan ja kytkeytyy suoraan OEE:n nopeuskomponenttiin.\n- Yli 100 % oleva arvo kertoo, että ohjelman arvot ovat varovaisia; se on ohjelman päivitystarve, ei käyttäjän poikkeama.\n- Käyttäjäkohtaisia arvoja ei pidä käyttää henkilöarviointiin vaan perehdytyksen ja ohjelmien kehittämiseen.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_machine_events.md"], "backlinks": ["/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/2-15-sykliajan-poikkeama-tavoitteesta.md", "reserved": false, "type": "Metric", "title": "2.15 Sykliajan poikkeama tavoitteesta", "description": "Kuinka paljon toteutunut kappalekohtainen jaksoaika poikkeaa tavoitteesta.", "tags": ["mittari", "oee", "edellyttaa-maarittelya"], "status": "stable", "readiness": "requires-definition", "unit": "%", "grain": "nimike, ohjelma, kone, työvaihe", "metric_id": "2.15", "table_name": "", "table_kind": "", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\n# Määritelmä\n\nKuinka paljon toteutunut kappalekohtainen jaksoaika poikkeaa tavoitteesta. Erittelee nopeushäviön nimike- ja ohjelmatasolle.\n\n| | |\n| :--- | :--- |\n| **Mittayksikkö** | % |\n| **Tarkastelutaso** | nimike, ohjelma, kone, työvaihe |\n| **Tila** | Edellyttää yrityskohtaista määrittelyä (ihannesykliaika) |\n\n# Computation\n\nLaskentakaava tietomallin teknisillä kenttänimillä:\n\n```text\n(cycle_time_machine_min − cycle_time_ideal_min) / cycle_time_ideal_min * 100\n```\n\nSama kaava semanttisilla nimillä:\n\n```text\n(Kappale jaksoaika konedata − Kappale jaksoaika tavoite)\n  / Kappale jaksoaika tavoite * 100\n```\n\n# Tietolähde\n\n[`fact_workphases`](/taulut/fact_workphases.md), tapahtumatasolla `fact_machine_events.unit_cycle_time_min`\n\n# Huomiot ja rajoitteet\n\n- Sama nimike eri koneilla tai eri ohjelmaversioilla on hyödyllisin vertailu; se paljastaa parhaan käytännön.\n- Sykliajan hajonta `STDDEV(unit_cycle_time_min)` yksittäisten kappaletapahtumien (`event_type_id = 9`) yli kertoo prosessin vakaudesta ilman mittausdataa.\n\nLaskennan yleiset periaatteet: [laskennan periaatteet](/laskennan-periaatteet.md).\n", "links": ["/laskennan-periaatteet.md", "/taulut/fact_workphases.md"], "backlinks": ["/mittarit/oee/index.md", "/taulut/fact_machine_events.md"]}, {"path": "/mittarit/oee/index.md", "reserved": true, "type": "Index", "title": "index", "description": "", "tags": [], "status": "", "readiness": "", "unit": "", "grain": "", "metric_id": "", "table_name": "", "table_kind": "", "generated": "", "body": "# OEE ja sen osat\n\nOEE eli kokonaistehokkuus kuvaa, kuinka suuri osa suunnitellusta tuotantoajasta käytetään hyväksyttyjen kappaleiden valmistamiseen tavoitenopeudella. Tietolähteenä on `fact_machine_events`, ihannesykliaika `fact_workphases`-taulusta.\n\nMääritellään ensin OEE:n perussuureet, joita alla olevat mittarit käyttävät:\n\n```text\nSuunniteltu tuotantoaika (min) = SUM(duration_min) WHERE event_type_id = 19\nKäyntiaika (min)               = SUM(machine_active_min) WHERE event_type_id IN (6, 8, 17)\nSeisokkiaika (min)             = SUM(idle_sum_min + exception_min + power_off_min)\nValmistettu määrä (kpl)        = SUM(produced_qty_machine) tai SUM(produced_qty_stamping)\nHyväksytty määrä (kpl)         = Valmistettu määrä − SUM(rejected_qty_stamping)\n```\n\n# Mittarit\n\n* [2.1 Suunniteltu tuotantoaika](2-01-suunniteltu-tuotantoaika.md) - Ajan, jonka kone oli tarkoitus olla tuotannossa.\n* [2.2 Käyntiaika](2-02-kayntiaika.md) - Ajan, jonka kone oli aktiivisessa työstössä.\n* [2.3 Seisokkiaika ja seisokkiaste](2-03-seisokkiaika-ja-seisokkiaste.md) - Ajan, jonka kone ei ollut tuotannossa suunnitellun tuotantoajan sisällä, sekä sen osuuden suunnitellusta ajasta.\n* [2.4 Käy
