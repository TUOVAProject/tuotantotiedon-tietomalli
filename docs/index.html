i** | `workcenter_group_name` | char | Työkeskusryhmän nimi. |\n| **Työkeskusryhmän kuvaus** | `workcenter_group_description` | char | Kuvaus työkeskuksen tyypistä. |\n\n# Luontilause\n\nSarakemäärittelyt. Täysi skeema perusavaimineen, viiteavaimineen ja indekseineen on tiedostossa [db_create.sql](/references/db_create.sql).\n\n```sql\nCREATE TABLE public.dim_workcenter_group (\n    workcenter_group_id bigint NOT NULL,\n    workcenter_group_name text,\n    workcenter_group_description text\n);\n```\n\nTaulu on osa [tuotantotiedon tietomallia](/tietomalli.md).\n", "links": ["/tietomalli.md"], "backlinks": ["/tietomalli.md", "/mittarit/muut/5-15-tyokeskusryhman-kuormitustasapaino.md", "/taulut/fact_workphases.md", "/taulut/index.md"]}, {"path": "/taulut/fact_machine_events.md", "reserved": false, "type": "PostgreSQL Table", "title": "Konetapahtumataulu (fact_machine_events)", "description": "Töiden toteumatietoja leimauksista ja/tai konedatasta johdettuna.", "tags": ["tietomalli", "faktataulu", "fact_machine_events"], "status": "stable", "readiness": "", "unit": "", "grain": "", "metric_id": "", "table_name": "fact_machine_events", "table_kind": "fakta", "generated": "{ by: tuova-okf-export/1.0, at: 2026-09-02T00:00:00Z }", "body": "\nTöiden toteumatietoja leimauksista ja/tai konedatasta johdettuna. Voi sisältää eri tarkkuustason datoja samassa taulussa, mutta pääosassa on työvaihe- tai vuorokausikohtaiset koonnit. Tarkimmaksi tasoksi on ajateltu yksittäisen kappaleen työstötapahtuma. Samalla työvaiheella voi olla useita erilaisia liittyviä tapahtumia. Keskeisenä on jakaa erilaiset tapahtumatyypit event_type_id ja source_id tiedoilla. Tapahtuman tyypistä riippuu, mitkä kentät ovat käytössä. Oleellisinta tietoa ovat aikaleimat ja aikaleimojen välissä olevan ajan jakatuminen. Konedata yhdistetään ERP-dataan tässä taulussa.\n\n# Schema\n\n| Näyttönimi | Tekninen nimi | Tyyppi | Kuvaus |\n| :--- | :--- | :--- | :--- |\n| **Konetahpatuma ID** | `machine_event_id` | PK / int | Konetapahtuman yksilöivä uniikki avain. |\n| **Tapahtumatyyppi ID** | `event_type_id` | FK / int | Tällä erotetaan erilaiset konetapahtumat toisistaan. Yhdistyy dim_event_type dimensiotauluun, jossa tapahtumat kuvattu. |\n| **Tapahtumalähde ID** | `source_id` | FK / int | Merkataan datan lähde. Yhdistyy dim_source tauluun. Oletuksena 1 = STAMPING, 2 = MACHINE API, 3 = SENSOR |\n| **Työvaihe ID** | `workphase_id` | FK / int | Yhdistää konetapahtuman jonkin työtilauksen vaiheeseen eli fact_workphases taulun riviin. |\n| **Työnumero** | `work_number` | char | Tuotantotilauksen tunniste. Tuotantotilauksille ei ole omaa taulua tässä tietomallissa, joten kyseessä \"degenoitunut dimensio\" |\n| **Työ ID** | `work_id` | int | Tuotantotilauksen tunnistekoodi. Käytetään taulujen yhdistelyihin. |\n| **Työkeskus ID** | `workcenter_id` | FK / int | Koneen/työkeskuksen tunniste. Yhdistyy dim_workcenter taulun konetietoihin. |\n| **Nimike ID** | `article_id` | FK / int | Työstettävän nimikkeen tunniste. Yhdistyy dim_article tauluun. |\n| **Käyttäjä ID** | `user_id` | FK / int | Koneen käyttäjän tunniste. |\n| **Ohjelma** | `program_name` | char | Koneessa ajossa olevan ohjelman nimi. |\n| **Aloituspäivä** | `start_date` | FK / int | Konetapahtuman aloituspäivä semanttisessa avainformaatissa (YYYYMMDD). |\n| **Lopetuspäivä** | `end_date` | FK / int | Konetapahtuman päättymispäivä semanttisessa avainformaatissa (YYYYMMDD). |\n| **Aloitusaika** | `start_time` | FK / int | Tapahtuman aloitusaika. Semanttisessa muodossa (HHMMSS). Aika on aikaleiman aikavyöhykkeessä. |\n| **Lopetusaika** | `end_time` | FK / int | Tapahtuman lopetusaika. Semanttisessa muodossa (HHMMSS). Aika on aikaleiman aikavyöhykkeessä. |\n| **Aloitus aikaleima** | `start_at` | datetime | Tapahtuman aloituksen aikaleima ISO8601 formaatissa. |\n| **Lopetus aikaleima** | `end_at` | datetime | Tapahtuman lopetuksen aikaleima ISO8601 formaatissa. |\n| **Kesto min** | `duration_min` | double | Tapahtuman kesto minuutteina. Laskettu aloitusajan ja lopetusajan erotuksesta. |\n| **Kappaleaika min** | `unit_time_min` | double | Yhden kappaleen laskettu kappaleaika. Voidaan laskea esim. jakamalla duration_min / produced_qty. |\n| **Kappale jaksoaika min** | `unit_cycle_time_min` | double | Yhden kappaleen keskimääräinen jaksoaika (sykliaika), jos on saatavilla.  Aika kappaleen valmistumisesta toisen kappaleen valmistumiseen. Usean kappaleen tapauksessa esim. keskiarvo. |\n| **Kappale koneaika min** | `unit_processing_time_min` | double | Yhden kappaleen työstöaika. Aika kappaleen työstön aloituksesta työstön loppumiseen. Useamman kappaleen tapauksessa esim. keskiarvo. |\n| **Tuotettu määrä leimausdata** | `produced_qty_stamping` | int | Tuotettujen kappaleiden määrä tapahtuman aikana leimausdatan pohjalta. |\n| **Tuotettu määrä konedata** | `produced_qty_machine` | int | Konedatasta laskettu tuotettujen kappaleiden määrä tapahtuman aikana. |\n| **Hylätty määrä kpl** | `rejected_qty_stamping` | int | Hylättyjen kappaleiden määrä. Mahdollisesti saatavilla leimausdatassa. |\n| **Kappalelaskuri** | `part_counter` | int | Koneen kappalelaskurin arvo tapahtuman loputtua. |\n| **Tehokas työstöaika min** | `efficient_production_min` | double | Koneen tehokas työstöaika tapahtuman aikana johdettuna konedatasta. |\n| **Tehoton työstöaika min** | `inefficient_production_min` | double | Koneen tehoton työstöaika tapahtuman aikana johdettuna konedatasta. Kone käy mutta ei \"täydellä teholla\". |\n| **Lastuamisaika min** | `cutting_time_min` | double | Koneen varsinainen lastuamisaika aktiivisen työn aikana. |\n| **Koneen apuaika min** | `non_cutting_time_min` | double | Aktiivisen työn aikana osuus ajasta, jolloin lastu ei irtoa. Sisältää esim. työstöpäiden pikaliikkeet, työkalujen vaihdot, työstönaikaiset mittaukset jne. |\n| **Syötön prosenttikytkin** | `feed_override` | double | Keskimääräinen syötön prosenttikytkimen (feed rate override) arvo työstön aikana. |\n| **Karan prosenttikytkin** | `spindle_override` | double | Keskimääräinen karan nopeuden prosenttikytkimen (spindle speed override) arvo työstön aikana. |\n| **Työstöaika min** | `machine_active_min` | double | Aktiivisen työstön määrä minuutteina. Voidaan laskea joko tehoton-tehokas jaosta tai lastuamis-ei lastuamisajasta, jos on jaettuna. |\n| **Asetusaika min** | `setup_time_min` | double | Asetusajan määrä tapahtuman aikana. On yrityskohtaista mitä asetusaikaan sisällytetään. |\n| **Vaihtoaika min** | `part_change_time_min` | double | Kappaleen vaihtoajan määrä tapahtuman aikana. Vaihtoaika on aika kappaleen työstön päättymisestä seuraavan kappaleen työstön alkuun saman työvaiheen aikana. |\n| **Muu odotusaika min** | `undefined_idle_min` | double | Muun tyhjäkäyntiajan määrä tapahtuman aikana. Käytetään, jos aikaa ei voi määrittää asetusajaksi tai kappaleen vaihtoajaksi. |\n| **Odotusaika min** | `idle_sum_min` | double | Summattu koneen tyhjäkäynti minuutteina tapahtuman aikana (setup_time_min + part_change_time_min + undefined_idle_min) |\n| **Sammutettu min** | `power_off_min` | double | Kone poissa päällä minuutteina. |\n| **Muu aika min** | `other_min` | double | Aika jota ei saatu kohdistettua mihinkään tapahtuman aikana. Esimerkiksi erotus duration_min ja eri tila-aikojen summasta. |\n| **Poikkeama min** | `exception_min` | double | Poikkeustilan (koneessa esim. virhetila päällä) kesto minuutteina. |\n| **Poikkeama ID** | `exception_id` | FK / int | Poikkeustilan yksilöivä tunniste. Yhdistyy dim_exception tauluun, jossa tarkemmat tiedot. Voidaan käyttää vaikka koneen ilmoittamien virhetilojen seurantaan. |\n| **Aikojen summa min** | `time_sum_min` | double | Tapahtumarivillä tarkasteltavien aikojen summa. Käytetään tarkistamaan, että saadaan sama kuin aikaleimoista laskettu kesto (duration_min). |\n| **Energiankulutus kWh** | `power_consumption_kwh` | double | Tapahtuman aikana kulutettu energiamäärä kWh, jos on saatavilla esim. konedatassa. |\n| **Lisätiedot** | `notes` | char | Kuvauksia, huomautuksia tai muuta tapahtumaan liittyvää tietoa. Voidaan käyttää myös lisädatan säilömiseen, jos kentät eivät riitä. |\n\n# Suhteet\n\n- [`fact_workphases`](/taulut/fact_workphases.md) — Työvaiheiden tapahtumakohtainen seuranta. (N:1)\n- [`fact_order_rows`](/taulut/fact_order_rows.md) — Konetapahtumat voidaan yhdistää tilausriveihin FactWorkPhases-taulun kautta. (N:1 (epäsuora))\n- [`dim_event_type`](/taulut/dim_event_type.md) — Tapahtumalajien luokittelu. (N:1)\n- [`dim_source`](/taulut/dim_source.md) — Datalähteiden hallinta ja laadun seuranta. (N:1)\n- [`dim_workcenter`](/taulut/dim_workcenter.md) — Kone- ja työkeskuskohtainen analytiikka. (N:1)\n- [`dim_article`](/taulut/dim_article.md) — Nimikekohtainen analytiikka. (N:1)\n- [`dim_user`](/taulut/dim_user.md) — Käyttäjäkohtainen analytiikka. (N:1)\n- [`dim_exception`](/taulut/dim_exception.md) — Poikkeama- ja häiriöanalytiikka. (N:1)\n- [`dim_date`](/taulut/dim_date.md) — Päiväkohtainen analytiikka. (N:1)\n- [`dim_time`](/taulut/dim_time.md) — Vuoro- ja tuntikohtainen analytiikka. (N:1)\n- Degenerate Dimensions — Työnumero, työ-ID ja ohjelman nimi säilytetään faktataulussa ilman erillisiä dimensiotauluja. (1:1)\n\n# Mittarit\n\nTaulun tiedoista laskettavat mittarit. Merkintä (+) tarkoittaa, että mittari tarvitsee myös toisen faktataulun tietoja.\n\n- **2.1** [Suunniteltu tuotantoaika](/mittarit/oee/2-01-suunniteltu-tuotantoaika.md) — `SUM(duration_min) WHERE event_type_id = 19`\n- **2.2** [Käyntiaika](/mittarit/oee/2-02-kayntiaika.md) — `SUM(machine_active_min) WHERE event_type_id IN (6, 8, 17)`\n- **2.3** [Seisokkiaika ja seisokkiaste](/mittarit/oee/2-03-seisokkiaika-ja-seisokkiaste.md) — `Seisokkiaika = SUM(idle_sum_min + exception_min + power_off_min); Seisokkiaste = Seisokkiaika / Suunniteltu tuotantoaika * 100`\n- **2.4** [Käytettävyys](/mittarit/oee/2-04-kaytettavyys.md) — `Käyntiaika / Suunniteltu tuotantoaika * 100`\n- **2.5** (+) [Nopeus](/mittarit/oee/2-05-nopeus.md) — `SUM(cycle_time_ideal_min * Valmistettu määrä) / Käyntiaika * 100`\n- **2.6** (+) [Laatukerroin](/mittarit/oee/2-06-laatukerroin.md) — `(SUM(produced_qty_machine) − SUM(rejected_qty_stamping)) / SUM(produced_qty_machine) * 100`\n- **2.7** (+) [OEE, kokonaistehokkuus](/mittarit/oee/2-07-oee-kokonaistehokkuus.md) — `Käytettävyys * Nopeus * Laatukerroin (desimaalilukuina); tai suoraan:; SUM(Hyväksytty määrä * cycle_time_ideal_min) / Suunniteltu tuotantoaika * 100`\n- **2.8** (+) [Täysin tuottava aika](/mittarit/oee/2-08-taysin-tuottava-aika.md) — `SUM(Hyväksytty määrä * cycle_time_ideal_min)`\n- **2.9** [Koneen käyttöaste](/mittarit/oee/2-09-koneen-kayttoaste.md) — `SUM(machine_active_min) / (tarkastelujakson päivien määrä * 1440) * 100`\n- **2.10** [Lastuamisaste](/mittarit/oee/2-10-lastuamisaste.md) — `SUM(cutting_time_min) / SUM(machine_active_min) * 100`\n- **2.11** [Apuajan osuus](/mittarit/oee/2-11-apuajan-osuus.md) — `SUM(non_cutting_time_min) / SUM(machine_active_min) * 100`\n- **2.12** [Asetus- ja vaihtoajan osuus](/mittarit/oee/2-12-asetus-ja-vaihtoajan-osuus.md) — `Asetusajan osuus = SUM(setup_time_min) / SUM(duration_min) * 100; Vaihtoajan osuus = SUM(part_change_time_min) / SUM(duration_min) * 100`\n- **2.13** [Tehottoman ajon osuus](/mittarit/oee/2-13-tehottoman-ajon-osuus.md) — `SUM(inefficient_production_min) / (SUM(efficient_production_min) + SUM(inefficient_production_min)) * 100`\n- **2.14** [Prosenttikytkinten keskiarvo](/mittarit/oee/2-14-prosenttikytkinten-keskiarvo.md) — `AVG(feed_override), AVG(spindle_override)`\n- **2.15** (+) [Sykliajan poikkeama tavoitteesta](/mittarit/oee/2-15-sykliajan-poikkeama-tavoitteesta.md) — `(cycle_time_machine_min − cycle_time_ideal_min) / cycle_time_ideal_min * 100`\n- **5.16** [Poikkeamien määrä ja keskimääräinen kesto](/mittarit/muut/5-16-poikkeamien-maara-ja-keskimaarainen-kesto.md) — `Määrä = COUNT(machine_event_id) WHERE event_type_id IN (4, 15); Kokonaisaika = SUM(exception_min); Keskim. kesto = SUM(exception_min) / COUNT(poikkeamat)`\n- **5.17** [Suunnittelemattomien seisokkien osuus](/mittarit/muut/5-17-suunnittelemattomien-seisokkien-osuus.md) — `SUM(exception_min + undefined_idle_min) / Suunniteltu tuotantoaika * 100`\n- **5.18** [Ylläpitoajan osuus](/mittarit/muut/5-18-yllapitoajan-osuus.md) — `SUM(duration_min) WHERE event_type_id = 5 / SUM(duration_min) * 100`\n- **5.19** [Energiankulutus ja sen suhdeluvut](/mittarit/muut/5-19-energiankulutus-ja-sen-suhdeluvut.md) — `Kulutus yhteensä = SUM(power_consumption_kwh); Kappaletta kohti = SUM(power_consumption_kwh) / SUM(produced_qty_machine); Käyntituntia kohti = SUM(power_consumption_kwh) / (SUM(machine_active_min) / 60); Tyhjäkäynnin osuus = SUM(power_consumption_kwh) WHERE event_type_id = 14 / SUM(power_consumption_kwh) * 100`\n- **5.20** [Miehittämättömän ajon osuus](/mittarit/muut/5-20-miehittamattoman-ajon-osuus.md) — `SUM(machine_active_min) ilman päällekkäistä event_type_id = 18 -jaksoa / SUM(machine_active_min) * 100`\n- **5.21** [Käyttäjä- ja vuorokohtainen tarkastelu](/mittarit/muut/5-21-kayttaja-ja-vuorokohtainen-tarkastelu.md) — `Mikä tahansa edellä kuvattu mittari ryhmiteltynä; dim_time.shift_id tai fact_machine_events.user_id mukaan; esim. AVG(setup_time_min) GROUP BY user_id, article_id`\n- **6.1** [Aikojen kohdistusaste](/mittarit/datan-laatu/6-01-aikojen-kohdistusaste.md) — `SUM(time_sum_min) / SUM(duration_min) * 100`\n- **6.2** [Kohdistamattoman ajan osuus](/mittarit/datan-laatu/6-02-kohdistamattoman-ajan-osuus.md) — `SUM(other_min) / SUM(duration_min) * 100`\n- **6.4** [Kappalemäärien ristiintarkistus](/mittarit/datan-laatu/6-04-kappalemaarien-ristiintarkistus.md) — `SUM(produced_qty_stamping) − SUM(produced_qty_machine); sekä part_counter-kentän jatkuvuuden tarkistus`\n- **6.5** [Konetapahtumien kohdistusaste työvaiheisiin](/mittarit/datan-laatu/6-05-konetapahtumien-kohdistusaste-tyovaiheisiin.md) — `COUNT(machine_event_id WHERE workphase_id IS NOT NULL) / COUNT(machine_event_id) * 100`\n\n# Luontilause\n\nSarakemääri | Laskun lähetyksen päivä laskutustiedoista. |\n| **Lasku maksupäivä** | `payment_date_actual` | FK / int | Laskun maksupäivä päivä laskutustiedoista. |\n| **Tilauksen tilan ID** | `order_state_id` | FK / int | Tilauksen tila. Yhdistyy dim_order_state tauluun. Yritys voi päättää itse mitä tiloja käytetään. |\n| **Tilauksen tyyppi** | `order_type` | char | Tilauksen tyyppi. Voi olla esimerkiksi \"myyntitilaus\" tai \"takuutyö\". |\n| **Tilattu määrä** | `ordered_qty` | int | Tilattu määrä tuotetta. Eri työvaiheissa tuotetut määrät fact_workphases taulussa. |\n| **Toimitettu määrä** | `delivered_qty` | int | Toimitettu määrä tuotetta. Eri työvaiheissa tuotetut määrät fact_workphases taulussa. |\n| **Kappalehinta** | `unit_price` | double | Tilausrivin tuotteen yhden kappaleen hinta. |\n| **Tilausrivi hinta** | `total_price` | double | Tilausrivin arvo valuutassa ilman arvonlisäveroa. Saadaan yleensä kertomalla unit_price * ordered_qty |\n| **Suorat työkustannukset suunniteltu** | `direct_work_cost_planned` | double | Suunniteltu suoran työn kustannus valmistuskustannuksissa. On eri tapoja laskea. Voidaan summata eri vaiheiden konetuntihinnoista laskettuja arvoja tai jyvittämällä henkilöiden työn osuutta (jos konekustannukset yleiskustannuksissa). |\n| **Suorat työkustannukset toteutunut** | `direct_work_cost_actual` | double | Toteutunut suoran työn kustannus valmistuskustannuksissa. |\n| **Materiaalikustannukset suunniteltu** | `material_cost_planned` | double | Valmistuksen suunnitellut suorat materiaalikulut. Voidaan laskea esim. materiaalien alkuvaraston arvo + ostot - loppuvaraston arvo. |\n| **Materiaalikustannukset toteutunut** | `material_cost_actual` | double | Valmistuksen toteutuneet suorat materiaalikulut. |\n| **Alihankintakustannukset suunniteltu** | `subcontracting_cost_planned` | double | Alihankinnan suunnitellut suorat kulut. Voi sisältää myös alihankintaan liittyvät logistiikkakulut. |\n| **Alihankintakustannukset toteutunut** | `subcontracting_cost_actual` | double | Alihankinnan toteutuneet suorat kulut. Voi sisältää myös alihankintaan liittyvät logistiikkakulut. |\n| **Muut suorat kustannukset** | `other_direct_costs_planned` | double | Muut muuttuvat kustannukset, kuten rahti, pakkaus, menetelmälisät… |\n| **Muut suorat kustannukset toteutunut** | `other_direct_costs_actual` | double | Toteutuneet muut muuttuvat kustannukset, kuten rahti, pakkaus, menetelmälisät… |\n| **Suorat tuotantokustannukset suunniteltu** | `prime_cost_planned_sum` | double | Tuotannon suunnitellut suorat tuotantokustannukset (välittömät kustannukset) ilman yleiskustannuslisää eli summattuna suora työ + materiaalit + alihankinta + muut suorat kustannukset. |\n| **Suorat tuotantokustannukset toteutunut** | `prime_cost_actual_sum` | double | Tuotannon toteutuneet suorat tuotantokustannukset (välittömät kustannukset) ilman yleiskustannuslisää eli summattuna suora työ + materiaalit + alihankinta + muut suorat kustannukset. |\n| **Kappalekustannukset suunniteltu** | `unit_prime_cost_planned` | double | Suunnitellut suorat tuotantokustannukset kappaletta kohti. |\n| **Kappalekustannukset toteutunut** | `unit_prime_cost_actual` | double | Toteutuneet suorat tuotantokustannukset kappaletta kohti. |\n| **Myyntikate suunniteltu** | `sales_margin_planned` | double | Tarjousvaiheessa laskettu myyntikate sisältäen yleiskustannuslisän ja voitto-osuuden. Voidaan laskea esim. total_price - prime_cost_planned_sum |\n| **Myyntikate toteutunut** | `sales_margin_actual` | double | Toteutunut myyntikate sisältäen yleiskustannuslisän ja voitto-osuuden. Voidaan laskea esim. total_price - prime_cost_actual_sum |\n| **Yleiskustannuslisä suunniteltu** | `overhead_costs_planned` | double | Hintaan laskettu yleiskustannuslisä eli tilaukselle määritetty  välillisten kustannusten osuus. Yleensä laskettu jonain lisäprosenttina tuotantokustannusten päälle. |\n| **Yleiskustannuslisä toteutunut** | `overhead_costs_actual` | double | Toteutunut yleiskustannuslisä eli tilaukselle määritetty välillisten kustannusten osuus. |\n| **Valmistuskustannukset suunniteltu** | `manufacturing_cost_planned` | double | Suunnitellut täydet valmistuskustannukset yhteensä. Sisältää suorat tuotantokustannukset ja yleiskustannukset. Synonyyminä usein \"omakustannehinta\" |\n| **Valmistuskustannukset toteutunut** | `manufacturing_cost_actual` | double | Toteutuneet täydet valmistuskustannukset yhteensä. Sisältää suorat tuotantokustannukset ja yleiskustannukset. Synonyyminä usein \"omakustannehinta\" |\n| **Kappale valmistuskustannukset suunniteltu** | `unit_manufacturing_cost_planned` | double | Suunnitellut valmistuskustannukset kappaletta kohti. |\n| **Kappale valmistuskustannukset toteutunut** | `unit_manufacturing_cost_actual` | double | Toteutuneet valmistuskustannukset kappaletta kohti. |\n| **Voittolisä suunniteltu** | `profit_planned` | double | Suunniteltu voittolisä kaikkien kustannusten vähennyksen jälkeen. Lasketaan vähentämällä myyntihinnasta kaikki kulut. Lasketaan yleensä jonain prosenttina omakustannehinnan päälle. |\n| **Voittolisä toteutunut** | `profit_actual` | double | Toteutunut voittolisä kaikkien kustannusten vähennyksen jälkeen. Lasketaan vähentämällä myyntihinnasta kaikki kulut. Lasketaan yleensä jonain prosenttina omakustannehinnan päälle. |\n| **Yksikkö** | `unit` | char | Tilattu yksikkö. |\n| **Valuutta** | `currency` | char | Käytetty valuutta. |\n| **Uusi nimike** | `new_article` | boolean | Tieto siitä onko kyseessä uusi nimike. |\n| **Tilaus valmis** | `order_complete` | boolean | Tilaus on hoidettu ja laskutettu (ei välttämättä maksettu). |\n\n# Suhteet\n\n- [`fact_workphases`](/taulut/fact_workphases.md) — Työvaiheiden kustannus- ja tuotantotietojen yhdistäminen tilausriveihin (1:N)\n- [`fact_machine_events`](/taulut/fact_machine_events.md) — Konetapahtumat voidaan yhdistää tilausriveihin epäsuorasti työvaihetaulun kautta. (1:N (epäsuora))\n- [`dim_customer`](/taulut/dim_customer.md) — Asiakastiedot (N:1)\n- [`dim_user`](/taulut/dim_user.md) — Myyjätiedot (N:1)\n- [`dim_article`](/taulut/dim_article.md) — Tuote-/nimiketiedot (N:1)\n- [`dim_order_state`](/taulut/dim_order_state.md) — Tilauksen tilatiedot (N:1)\n- [`dim_date`](/taulut/dim_date.md) — Tilaus-, tuotanto-, toimitus-, lähetys-, laskutus- ja maksupäivien analysointi (N:1)\n- Degenerate Dimensions — Tilausnumero, työnumero ja työ-ID säilytetään faktataulussa ilman omia dimensioita helpottamaan suodatusta ja yhdistelyjä (1:1)\n\n# Mittarit\n\nTaulun tiedoista laskettavat mittarit. Merkintä (+) tarkoittaa, että mittari tarvitsee myös toisen faktataulun tietoja.\n\n- **1.1** [Tuotannon läpimenoaika](/mittarit/aikavertailut/1-01-tuotannon-lapimenoaika.md) — `dim_date[production_end_date_actual].date_index − dim_date[production_start_date_actual].date_index`\n- **1.2** [Tuotannon läpimenoajan poikkeama](/mittarit/aikavertailut/1-02-tuotannon-lapimenoajan-poikkeama.md) — `(date_index(production_end_date_actual) − date_index(production_start_date_actual)) − (date_index(production_end_date_planned) − date_index(production_start_date_planned))`\n- **1.3** [Tuotannon aloituspoikkeama](/mittarit/aikavertailut/1-03-tuotannon-aloituspoikkeama.md) — `date_index(production_start_date_actual) − date_index(production_start_date_planned)`\n- **1.4** [Tuotannon valmistumispoikkeama](/mittarit/aikavertailut/1-04-tuotannon-valmistumispoikkeama.md) — `date_index(production_end_date_actual) − date_index(production_end_date_planned)`\n- **1.5** [Tilauksesta toimitukseen kulunut aika](/mittarit/aikavertailut/1-05-tilauksesta-toimitukseen-kulunut-aika.md) — `date_index(delivery_date_actual) − date_index(order_created_date)`\n- **1.6** [Toimituspoikkeama](/mittarit/aikavertailut/1-06-toimituspoikkeama.md) — `date_index(delivery_date_actual) − date_index(delivery_date_planned)`\n- **1.7** [Tilausten toimitusvarmuus](/mittarit/aikavertailut/1-07-tilausten-toimitusvarmuus.md) — `COUNT(order_row_id WHERE delivery_date_actual <= delivery_date_planned) / COUNT(order_row_id WHERE delivery_date_actual IS NOT NULL) * 100`\n- **1.8** [OTIF, ajallaan ja täysimääräisenä toimitetut](/mittarit/aikavertailut/1-08-otif-ajallaan-ja-taysimaaraisena-toimitetut.md) — `COUNT(order_row_id WHERE delivery_date_actual <= delivery_date_planned AND delivered_qty >= ordered_qty) / COUNT(order_row_id WHERE delivery_date_actual IS NOT NULL) * 100`\n- **3.1** [Myynti](/mittarit/kannattavuus/3-01-myynti.md) — `SUM(total_price)`\n- **3.2** [Toteutunut kate](/mittarit/kannattavuus/3-02-toteutunut-kate.md) — `SUM(sales_margin_actual); tai SUM(total_price) − SUM(prime_cost_actual_sum) (myyntikate); tai SUM(total_price) − SUM(manufacturing_cost_actual) (tulos yleiskustannusten jälkeen)`\n- **3.3** [Kate-%](/mittarit/kannattavuus/3-03-kate.md) — `SUM(sales_margin_actual) / SUM(total_price) * 100`\n- **3.4** [Katepoikkeama](/mittarit/kannattavuus/3-04-katepoikkeama.md) — `Euroina: SUM(sales_margin_actual) − SUM(sales_margin_planned); Prosenttiyksikköinä: (SUM(sales_margin_actual) / SUM(total_price) − SUM(sales_margin_planned) / SUM(total_price)) * 100`\n- **3.5** [Jälkilaskennan poikkeama](/mittarit/kannattavuus/3-05-jalkilaskennan-poikkeama.md) — `SUM(prime_cost_actual_sum) − SUM(prime_cost_planned_sum)`\n- **3.6** [Jälkilaskennan poikkeamaprosentti](/mittarit/kannattavuus/3-06-jalkilaskennan-poikkeamaprosentti.md) — `(SUM(prime_cost_actual_sum) − SUM(prime_cost_planned_sum)) / SUM(prime_cost_planned_sum) * 100`\n- **3.7** [Kustannuslajikohtainen poikkeama](/mittarit/kannattavuus/3-07-kustannuslajikohtainen-poikkeama.md) — `SUM(direct_work_cost_actual) − SUM(direct_work_cost_planned); SUM(material_cost_actual) − SUM(material_cost_planned); SUM(subcontracting_cost_actual) − SUM(subcontracting_cost_planned); SUM(other_direct_costs_actual) − SUM(other_direct_costs_planned); SUM(overhead_costs_actual) − SUM(overhead_costs_planned)`\n- **3.8** [Kappalekohtainen valmistuskustannus](/mittarit/kannattavuus/3-08-kappalekohtainen-valmistuskustannus.md) — `SUM(manufacturing_cost_actual) / SUM(ordered_qty); tai AVG(unit_manufacturing_cost_actual)`\n- **3.9** [Voittolisä-%](/mittarit/kannattavuus/3-09-voittolisa.md) — `SUM(profit_actual) / SUM(manufacturing_cost_actual) * 100`\n- **3.10** (+) [Tuntikate](/mittarit/kannattavuus/3-10-tuntikate.md) — `SUM(sales_margin_actual) / (SUM(fact_workphases.phase_duration_actual_min) / 60)`\n- **3.12** [Asiakas-, tuote- ja myyjäkohtainen kate](/mittarit/kannattavuus/3-12-asiakas-tuote-ja-myyjakohtainen-kate.md) — `SUM(sales_margin_actual) GROUP BY customer_id | article_id | seller_id; SUM(sales_margin_actual) / SUM(total_price) * 100 samalla ryhmittelyllä`\n- **3.14** [Alihankinnan osuus kustannuksista](/mittarit/kannattavuus/3-14-alihankinnan-osuus-kustannuksista.md) — `SUM(subcontracting_cost_actual) / SUM(prime_cost_actual_sum) * 100`\n- **3.15** [Tilauskannan arvo ja laskuttamaton valmis tuotanto](/mittarit/kannattavuus/3-15-tilauskannan-arvo-ja-laskuttamaton-valmis-tuotanto.md) — `Tilauskanta = SUM(total_price) WHERE order_complete = FALSE; Laskuttamaton valmis = SUM(total_price) WHERE order_complete = FALSE AND production_end_date_actual IS NOT NULL`\n- **3.16** [Laskutusviive ja maksuaika](/mittarit/kannattavuus/3-16-laskutusviive-ja-maksuaika.md) — `Laskutusviive = date_index(invoice_date_actual) − date_index(dispatch_date_actual); Maksuaika = date_index(payment_date_actual) − date_index(invoice_date_actual)`\n- **4.7** (+) [Hylkäyksen kustannusvaikutus](/mittarit/laatu/4-07-hylkayksen-kustannusvaikutus.md) — `SUM(rejected_qty * unit_manufacturing_cost_actual) / SUM(manufacturing_cost_actual) * 100`\n- **5.6** (+) [Keskeneräisen tuotannon määrä ja arvo](/mittarit/muut/5-06-keskeneraisen-tuotannon-maara-ja-arvo.md) — `Määrä = COUNT(order_row_id) WHERE production_start_date_actual IS NOT NULL AND production_end_date_actual IS NULL; Arvo = SUM(prime_cost_planned_sum) samalla ehdolla; Jäljellä oleva työ = SUM(phase_duration_planned_min) WHERE end_date_actual IS NULL`\n- **5.22** [Uusien nimikkeiden osuus ja kustannuspoikkeama](/mittarit/muut/5-22-uusien-nimikkeiden-osuus-ja-kustannuspoikkeama.md) — `Osuus = COUNT(order_row_id WHERE new_article = TRUE) / COUNT(order_row_id) * 100; Poikkeamaero = Jälkilaskennan poikkeama-% (new_article = TRUE) − Jälkilaskennan poikkeama-% (new_article = FALSE)`\n- **6.6** (+) [Kytkemättömien rivien osuus](/mittarit/datan-laatu/6-06-kytkemattomien-rivien-osuus.md) — `COUNT(order_row_id ilman fact_workphases-riviä) / COUNT(order_row_id) * 100; COUNT(workphase_id ilman fact_machine_events-riviä) / COUNT(workphase_id) * 100`\n- **6.7** [Toteumatietojen kattavuus](/mittarit/datan-laatu/6-07-toteumatietojen-kattavuus.md) — `COUNT(rivit joilla kenttä IS NULL) / COUNT(rivit) * 100; esim. start_timestamp_actual, end_timestamp_actual,; prime_cost_actual_sum, delivered_qty`\n\n# Luontilause\n\nSarakemäärittelyt. Täysi skeema perusavaimineen, viiteavaimineen ja indekseineen on tiedostossa [db_create.sql](/references/db_create.sql).\n\n```sql\nCREATE TABLE public.fact_order_rows (\n    order_row_id bigint NOT NULL,\n    order_number text,\n    work_number text,\n    work_id bigint,\n    customer_id bigint,\n    seller_id bigint,\n    article_id bigint,\n    order_created_date integer,\n    production_start_date_planned integer,\n    production_start_date_actual integer,\n    production_end_date_planned integer,\n    production_end_date_actual integer,\n    dispatch_date_planned integer,\n    dispatch_date_actual integer,\n    delivery_date_planned integer,\n    delivery_date_actual integer,\n    invoice_date_actual integer,\n    payment_date_actual integer,\n    order_state_id bigint,\n    order_type text,\n    ordered_qty integer,\n    delivered_qty integer,\n    unit_price double precision,\n    total_price double precision,\n    direct_work_cost_planned double precision,\n    direct_work_cost_actual double precision,\n    material_cost_planned double precision,\n    material_cost_actual double precision,\n    su maan taulujen yhdistelyjä. |\n| **Työkeskus ID** | `workcenter_id` | FK / int | Yksittäisen koneen/kuormitusryhmän/muun työkeskuksen tunniste (koneet, alihankkijat, muut työvaiheet). Tässä tietomallissa erilaiset työkeskukset tulevat samalla tavalla. Yhdistyy dim_workcenter ulottuvuustauluun. Vaatii tarkempaa määritystä mm. tilanteessa, jossa työ on toteutettu eri koneella kuin alkujaan suunniteltu tai työvaihe on jaettu usean koneen kesken. |\n| **Työkeskusryhmä ID** | `workcenter_group_id` | FK / int | Työkeskuksen tyypin tunniste. Yhdistyy dim_workcenter_group tauluun. |\n| **Nimike ID** | `article_id` | FK / int | Nimikkeen/tuotteen tunniste. Yhdistyy dim_article ulottuvuustauluun. |\n| **Vaihenumero** | `phase_number` | int | Työvaiheen numero. Tyypillisesti järjestyksessä, jos useampi vaihe työssä. |\n| **Vaihekuvaus** | `phase_description` | char | Työvaiheen kuvaus, jos saatavilla. Voidaan käyttää erottamaan eri tyyppisiä työvaiheita toisistaan (työstö, alihankinta, kokoonpano…) |\n| **Vaihetila** | `phase_status` | char | Työvaiheen tila. Yrityksen määritettävissä. |\n| **Alihankintavaihe** | `subcontracting_phase` | boolean | Tieto siitä, onko kyseessä alihankintatyövaihe. |\n| **Aloituspäivä alkuperäinen** | `start_date_original_planned` | FK / int | Työvaiheen ensimmäinen määritetty aloituspäivä ERP/MES järjestelmästä. |\n| **Aloituspäivä suunniteltu** | `start_date_latest_planned` | FK / int | Työvaiheen viimeisin suunniteltu aloituspäivä ERP/MES järjestelmästä. Ensimmäinen ajankohta, jos on pilkottu useaan osaan vaihe. |\n| **Aloituspäivä toteutunut** | `start_date_actual` | FK / int | Työvaiheen toteutunut aloituspäivä (yleensä leimausdatasta). |\n| **Lopetuspäivä alkuperäinen** | `end_date_original_planned` | FK / int | Työvaiheen ensimmäinen määritetty lopetuspäivä ERP/MES järjestelmästä. |\n| **Lopetuspäivä suunniteltu** | `end_date_latest_planned` | FK / int | Työvaiheen viimeisin suunniteltu lopetuspäivä ERP/MES järjestelmästä. Viimeinen ajankohta, jos on pilkottu useaan osaan vaihe. |\n| **Lopetuspäivä toteutunut** | `end_date_actual` | FK / int | Työvaiheen toteutunut lopetuspäivä (yleensä leimausdatasta). |\n| **Aloitusaika suunniteltu** | `start_time_planned` | FK / int | Työvaiheen viimeisin suunniteltu aloitusaika ERP/MES järjestelmästä (jos saatavilla). Semanttisessa muodossa (HHMMSS). Aika on aikaleiman aikavyöhykkeessä. |\n| **Aloitusaika toteutunut** | `start_time_actual` | FK / int | Työvaiheen toteutunut aloitusaika (yleensä leimaustiedoista). Semanttisessa muodossa (HHMMSS). Aika on aikaleiman aikavyöhykkeessä. |\n| **Lopetusaika suunniteltu** | `end_time_planned` | FK / int | Työvaiheen viimeisin suunniteltu lopetusaika ERP/MES järjestelmästä (jos saatavilla). Semanttisessa muodossa (HHMMSS). Aika on aikaleiman aikavyöhykkeessä. |\n| **Lopetusaika toteutunut** | `end_time_actual` | FK / int | Työvaiheen toteutunut lopetusaika (yleensä leimaustiedoista). Semanttisessa muodossa (HHMMSS). Aika on aikaleiman aikavyöhykkeessä. |\n| **Aloitus aikaleima suunniteltu** | `start_timestamp_planned` | datetime | Työvaiheen suunnitellun aloitusajan aikaleima ISO8601-formaatissa. |\n| **Lopetus aikaleima suunniteltu** | `end_timestamp_planned` | datetime | Työvaiheen suunnitellun lopetusajan aikaleima ISO8601-formaatissa. |\n| **Aloitus aikaleima toteutunut** | `start_timestamp_actual` | datetime | Työvaiheen toteutuneen aloitusajan aikaleima ISO8601-formaatissa. |\n| **Lopetus aikaleima toteutunut** | `end_timestamp_actual` | datetime | Työvaiheen toteutuneen lopetusajan aikaleima ISO8601-formaatissa. |\n| **Suunniteltu määrä** | `planned_qty` | int | Vaiheessa tuotettavaksi suunniteltujen kappaleiden määrä. Huom! Voi olla eri määrä kuin yksittäisellä tilausrivillä. |\n| **Tehty määrä** | `produced_qty` | int | Vaiheessa kaikkiaan tuotettu kappalemäärä. |\n| **Hylätty määrä** | `rejected_qty` | int | Hylättyjen kappaleiden määrä. |\n| **Tuntihinta** | `workcenter_hour_rate` | double | Työkeskuksen tuntihinta. Yleensä käytännössä koneelle määritetty konetuntihinta kyseisen työn ajankohtana. |\n| **Vaihekustannus suunniteltu** | `phase_cost_planned` | double | Työvaiheen suunnitellut suoran työn kustannukset. Voi olla laskettu myös workcenter_hour_rate pohjalta, jos se on kustannusmallina. |\n| **Vaihekustannus leimaukset** | `phase_cost_actual_stamping` | double | Työvaiheen toteutuneet suoran työn kustannukset leimausten perusteella. Voi olla laskettu myös konetuntihinnan pohjalta suhteutettuna toteutuneeseen aikaan, jos se on kustannusmallina. |\n| **Vaihekustannus konedata** | `phase_cost_actual_machine` | double | Työvaiheen toteutuneet suoran työn kustannukset. Voi olla laskettu myös konetuntihinnan pohjalta suhteutettuna toteutuneeseen aikaan, jos se on kustannusmallina. |\n| **Asetusaika suunniteltu** | `setup_time_planned_min` | double | Suunniteltu asetustyön kesto minuuteissa. |\n| **Asetusaika leimattu** | `setup_time_stamping_min` | double | Toteutunut asetustyön kesto minuuteissa leimausdatan pohjalta (jos saatavilla) |\n| **Asetusaika konedata** | `setup_time_machine_min` | double | Toteutunut asetustyön kesto minuuteissa konedatan pohjalta (jos saatavilla) |\n| **Tuotantoaika suunniteltu** | `production_time_planned_min` | double | Vaiheen suunniteltu työstöaika minuutteina. |\n| **Tuotantoaika leimattu** | `production_time_stamping_min` | double | Vaiheen toteutunut työstöaika leimausdatan pohjalta. |\n| **Tuotantoaika konedata** | `production_time_machine_min` | double | Vaiheen toteutunut työstöaika konedatan pohjalta. |\n| **Vaiheaika suunniteltu** | `phase_duration_planned_min` | double | Suunniteltu yhteenlaskettu vaiheaika sisältäen asetustyön ja työstöajan. |\n| **Vaiheaika leimattu** | `phase_duration_stamping_min` | double | Toteutunut leimauksista yhteenlaskettu vaiheaika sisältäen asetustyön ja työstöajan. Kaikkien erillisten työstökertojen summa. |\n| **Vaiheaika konedata** | `phase_duration_machine_min` | double | Toteutunut konedatasta yhteenlaskettu vaiheaika sisältäen asetustyön ja työstöajan. Kaikkien erillisten työstökertojen summa. |\n| **Kappaleaika suunniteltu** | `unit_time_planned_min` | double | Yhden kappaleen suunniteltu kappaleaika. Saadaan jakamalla suunniteltu vaiheaika (phase_duration_planned_min) suunniteltujen kappaleiden määrällä. |\n| **Kappaleaika leimattu** | `unit_time_stamping_min` | double | Yhden kappaleen leimausten perusteella kappaleaika. Saadaan jakamalla leimattu vaiheaika tuotettujen kappaleiden määrällä. |\n| **Kappaleaika konedata** | `unit_time_machine_min` | double | Yhden kappaleen konedatan perusteella kappaleaika. Saadaan jakamalla laskettu vaiheaika tuotettujen kappaleiden määrällä. |\n| **Kappale jaksoaika tavoite** | `cycle_time_ideal_min` | double | Yhden kappaleen paras mahdollinen tavoiteltu sykliaika/jaksoaika = aika kahden valmistuneen kappaleen välillä. Voi olla eri kuin mitä suunnittelussa käytetään. Käytetään OEE laskennassa, jos saatavilla. |\n| **Kappale jaksoaika suunniteltu** | `cycle_time_planned_min` | double | Yhden kappaleen suunniteltu sykliaika/jaksoaika = aika kahden valmistuneen kappaleen välillä. |\n| **Kappale jaksoaika leimattu** | `cycle_time_stamping_min` | double | Yhden kappaleen leimausten perusteella sykliaika/jaksoaika = aika kahden valmistuneen kappaleen välillä. Paras arvio, jos on erikseen mitattu ja leimattu. |\n| **Kappale jaksoaika konedata** | `cycle_time_machine_min` | double | Yhden kappaleen konedatan perusteella laskettu sykliaika/jaksoaika. Laskettu keskimääräinen tai mediaaniaika kappaleen valmistumisesta seuraavan kappaleen valmistumiseen. |\n| **Koneaika tavoite** | `processing_time_ideal_min` | double | Yhden kappaleen tavoiteltu koneistusaika = aika kappaleen koneistuksen alkamisesta päättymiseen. Voi olla eri asia kuin suunniteltu tai toteutunut koneistusaika. |\n| **Koneaika suunniteltu** | `processing_time_planned_min` | double | Yhden kappaleen suunniteltu koneistusaika = aika kappaleen koneistuksen alkamisesta päättymiseen. |\n| **Koneaika leimattu** | `processing_time_stamping_min` | double | Leimausdatan perusteella yhden kappaleen koneistusaika = aika kappaleen koneistuksen alkamisesta päättymiseen. |\n| **Koneaika konedata** | `processing_time_machine_min` | double | Konedatan perusteella yhden kappaleen koneistusaika = aika kappaleen koneistuksen alkamisesta päättymiseen. |\n\n# Suhteet\n\n- [`fact_order_rows`](/taulut/fact_order_rows.md) — Työvaiheen yhdistäminen tilausriviin sekä asiakkaaseen, myyntiin ja toimituksiin liittyviin tietoihin. (N:1)\n- [`fact_machine_events`](/taulut/fact_machine_events.md) — Konetapahtumien liittäminen työvaiheisiin. (1:N)\n- [`dim_workcenter`](/taulut/dim_workcenter.md) — Kone-, työpiste-, alihankkija- tai muun resurssikohtaisen suorituskyvyn analysointi. (N:1)\n- [`dim_workcenter_group`](/taulut/dim_workcenter_group.md) — Työkeskusten ryhmäkohtainen kapasiteetti-, kuormitus- ja tehokkuusraportointi. (N:1)\n- [`dim_article`](/taulut/dim_article.md) — Nimike-/tuotekohtaisten valmistusaikojen, kustannusten ja laadun analysointi. (N:1)\n- [`dim_date`](/taulut/dim_date.md) — Aikataulujen, läpimenoaikojen, myöhästymisten ja toimitusvarmuuden analysointi. (N:1)\n- [`dim_time`](/taulut/dim_time.md) — Vuoro-, tunti- ja kellonaikakohtaisten tapahtumien analysointi. (N:1)\n- Degenerate Dimensions — Työnumero ja työ-ID säilytetään faktataulussa ilman erillisiä dimensiotauluja. (1:1)\n\n# Mittarit\n\nTaulun tiedoista laskettavat mittarit. Merkintä (+) tarkoittaa, että mittari tarvitsee myös toisen faktataulun tietoja.\n\n- **1.9** [Työvaiheen toteutunut kesto](/mittarit/aikavertailut/1-09-tyovaiheen-toteutunut-kesto.md) — `end_timestamp_actual − start_timestamp_actual`\n- **1.10** [Vaiheajan poikkeama](/mittarit/aikavertailut/1-10-vaiheajan-poikkeama.md) — `(SUM(phase_duration_actual_min) − SUM(phase_duration_planned_min)) / SUM(phase_duration_planned_min) * 100`\n- **1.11** (+) [Asetusajan poikkeama](/mittarit/aikavertailut/1-11-asetusajan-poikkeama.md) — `(SUM(setup_time_actual_min) − SUM(setup_time_planned_min)) / SUM(setup_time_planned_min) * 100`\n- **1.12** [Työvaiheiden aikataulupitävyys](/mittarit/aikavertailut/1-12-tyovaiheiden-aikataulupitavyys.md) — `COUNT(workphase_id WHERE end_date_actual <= end_date_latest_planned) / COUNT(workphase_id WHERE end_date_actual IS NOT NULL) * 100`\n- **1.13** [Uudelleenaikataulutettujen työvaiheiden osuus](/mittarit/aikavertailut/1-13-uudelleenaikataulutettujen-tyovaiheiden-osuus.md) — `COUNT(workphase_id WHERE start_date_original_planned <> start_date_latest_planned OR end_date_original_planned <> end_date_latest_planned) / COUNT(workphase_id) * 100`\n- **1.14** [Odotusaika työvaiheiden välillä](/mittarit/aikavertailut/1-14-odotusaika-tyovaiheiden-valilla.md) — `start_timestamp_actual(phase_number = n+1) − end_timestamp_actual(phase_number = n); saman work_id:n sisällä`\n- **3.11** [Asetuskustannus kappaletta kohti](/mittarit/kannattavuus/3-11-asetuskustannus-kappaletta-kohti.md) — `(setup_time_planned_min / 60 * workcenter_hour_rate) / planned_qty`\n- **3.13** [Vaihekustannuksen poikkeama](/mittarit/kannattavuus/3-13-vaihekustannuksen-poikkeama.md) — `SUM(phase_cost_actual_stamping) − SUM(phase_cost_planned)`\n- **4.1** [Hyväksytty ja hylätty määrä](/mittarit/laatu/4-01-hyvaksytty-ja-hylatty-maara.md) — `Hylätty määrä = SUM(rejected_qty); Hyväksytty määrä = SUM(produced_qty) − SUM(rejected_qty)`\n- **4.2** [Hylkäysaste](/mittarit/laatu/4-02-hylkaysaste.md) — `SUM(rejected_qty) / SUM(produced_qty) * 100`\n- **4.3** [Laatukerroin ja hyväksymisaste](/mittarit/laatu/4-03-laatukerroin-ja-hyvaksymisaste.md) — `(SUM(produced_qty) − SUM(rejected_qty)) / SUM(produced_qty) * 100`\n- **4.4** [PPM](/mittarit/laatu/4-04-ppm.md) — `SUM(rejected_qty) / SUM(produced_qty) * 1000000`\n- **4.5** [Ensimmäisen läpäisyn saanto, FPY](/mittarit/laatu/4-05-ensimmaisen-lapaisyn-saanto-fpy.md) — `(SUM(produced_qty) − SUM(rejected_qty)) / SUM(produced_qty) * 100; laskettuna työvaiheit anned < tarkastelupäivä AND end_date_actual IS NULL / Työjonon kuormitus * 100`\n- **5.11** (+) [Kuormitusaste](/mittarit/muut/5-11-kuormitusaste.md) — `Työpisteen kokonaiskuormitus / Tehollinen kapasiteetti * 100; Tehollinen kapasiteetti = SUM(duration_min) WHERE event_type_id = 19; tai erillinen kapasiteettiparametri`\n- **5.12** [Vapaa kapasiteetti tai kapasiteettivaje](/mittarit/muut/5-12-vapaa-kapasiteetti-tai-kapasiteettivaje.md) — `Tehollinen kapasiteetti − Työpisteen kokonaiskuormitus; Puskurin osuus = (Tehollinen kapasiteetti − kuormitus) / Tehollinen kapasiteetti * 100`\n- **5.13** [Kuormitushorisontti](/mittarit/muut/5-13-kuormitushorisontti.md) — `Työjonon kuormitus / (Tehollinen kapasiteetti per päivä)`\n- **5.14** [Osoitettu kapasiteetti](/mittarit/muut/5-14-osoitettu-kapasiteetti.md) — `AVG(SUM(produced_qty * unit_time_planned_min)) valituilta vertailujaksoilta GROUP BY workcenter_id, jakso`\n- **5.15** [Työkeskusryhmän kuormitustasapaino](/mittarit/muut/5-15-tyokeskusryhman-kuormitustasapaino.md) — `STDDEV(kuormitus) GROUP BY workcenter_group_id; tai (MAX(kuormitus) − MIN(kuormitus)) / AVG(kuormitus) * 100`\n- **6.3** [Leimaus- ja konedatan poikkeama](/mittarit/datan-laatu/6-03-leimaus-ja-konedatan-poikkeama.md) — `(SUM(phase_duration_stamping_min) − SUM(phase_duration_machine_min)) / SUM(phase_duration_machine_min) * 100`\n- **6.8** [Ihannesykliajan kattavuus](/mittarit/datan-laatu/6-08-ihannesykliajan-kattavuus.md) — `COUNT(workphase_id WHERE cycle_time_ideal_min IS NOT NULL) / COUNT(workphase_id) * 100`\n\n# Luontilause\n\nSarakemäärittelyt. Täysi skeema perusavaimineen, viiteavaimineen ja indekseineen on tiedostossa [db_create.sql](/references/db_create.sql).\n\n```sql\nCREATE TABLE public.fact_workphases (\n    workphase_id bigint NOT NULL,\n    workphase_number text,\n    order_row_id bigint,\n    work_number text,\n    work_id bigint,\n    workcenter_id bigint,\n    workcenter_group_id bigint,\n    article_id bigint,\n    phase_number integer,   const groups = {};
  DATA.forEach(c => {
    const hay = (c.title+' '+c.description+' '+(c.tags||[]).join(' ')+' '+c.path).toLowerCase();
    if(f && hay.indexOf(f) === -1) return;
    (groups[groupOf(c)] = groups[groupOf(c)] || []).push(c);
  });
  listEl.innerHTML = Object.keys(groups).map(g =>
    '<div class="grp">'+esc(g)+' ('+groups[g].length+')</div>' +
    groups[g].map(c =>
      '<a class="item" href="#'+c.path+'" data-p="'+c.path+'">'+esc(c.title)+
      (c.description ? '<span class="d">'+esc(c.description)+'</span>' : '')+'</a>'
    ).join('')
  ).join('') || '<div class="grp">ei osumia</div>';
  mark();
}
function mark(){
  document.querySelectorAll('.item').forEach(a =>
    a.classList.toggle('on', a.dataset.p === current));
}
document.getElementById('q').addEventListener('input', e => renderList(e.target.value));

/* ---------- konseptinäkymä ---------- */
let current = '/index.md';
const view = document.getElementById('view');
function show(path){
  const c = BY[path] || BY['/index.md'];
  current = c.path;
  const chips = [];
  chips.push('<span class="chip t">'+esc(c.type)+'</span>');
  if(c.metric_id) chips.push('<span class="chip">'+esc(c.metric_id)+'</span>');
  if(c.unit) chips.push('<span class="chip">yksikkö: '+esc(c.unit)+'</span>');
  if(c.table_kind) chips.push('<span class="chip">'+esc(c.table_kind)+'taulu</span>');
  if(c.readiness === 'requires-definition')
    chips.push('<span class="chip warn">edellyttää määrittelyä</span>');
  if(c.status) chips.push('<span class="chip">'+esc(c.status)+'</span>');
  (c.tags||[]).forEach(t => chips.push('<span class="chip">'+esc(t)+'</span>'));

  const rel = [];
  if(c.links.length) rel.push('<h3>Linkit tästä</h3>' +
    c.links.map(p=>'<a href="#'+p+'">'+esc(BY[p].title)+'</a>').join(''));
  if(c.backlinks.length) rel.push('<h3>Viittaukset tähän</h3>' +
    c.backlinks.map(p=>'<a href="#'+p+'">'+esc(BY[p].title)+'</a>').join(''));

  view.innerHTML = '<article><div class="crumb">'+esc(c.path)+'</div>' +
    (c.reserved ? '' : '<h1>'+esc(c.title)+'</h1><div class="chips">'+chips.join('')+'</div>') +
    md(c.body) +
    (rel.length ? '<div class="rel">'+rel.join('')+'</div>' : '') +
    '</article>';
  view.scrollTop = 0;
  mark();
}
window.addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if(h && BY[h]) show(h);
});

/* ---------- verkkonäkymä ---------- */
const svg = document.getElementById('graph');
let nodes = [], edges = [], sim = false;
function buildGraph(){
  if(sim) return; sim = true;
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  nodes = DATA.map((c,i) => ({
    c, x: W/2 + Math.cos(i)*Math.min(W,H)*0.35 + (i%7)*4,
    y: H/2 + Math.sin(i)*Math.min(W,H)*0.35 + (i%5)*4, vx:0, vy:0
  }));
  const idx = {}; nodes.forEach((n,i)=> idx[n.c.path] = i);
  edges = [];
  DATA.forEach(c => c.links.forEach(l => {
    if(idx[l] !== undefined && idx[c.path] !== idx[l])
      edges.push([idx[c.path], idx[l]]);
  }));
  for(let it=0; it<320; it++){
    const k = 1 - it/320;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        let dx = nodes[j].x-nodes[i].x, dy = nodes[j].y-nodes[i].y;
        let d2 = dx*dx+dy*dy || 0.01, d = Math.sqrt(d2);
        const rep = 900/d2;
        const fx = dx/d*rep, fy = dy/d*rep;
        nodes[i].x -= fx*k; nodes[i].y -= fy*k;
        nodes[j].x += fx*k; nodes[j].y += fy*k;
      }
    }
    edges.forEach(([a,b]) => {
      const dx = nodes[b].x-nodes[a].x, dy = nodes[b].y-nodes[a].y;
      const d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      const f = (d-70)*0.02*k;
      nodes[a].x += dx/d*f; nodes[a].y += dy/d*f;
      nodes[b].x -= dx/d*f; nodes[b].y -= dy/d*f;
    });
    nodes.forEach(n => { n.x += (W/2-n.x)*0.002*k; n.y += (H/2-n.y)*0.002*k; });
  }
  drawGraph();
  document.getElementById('legend').innerHTML = [
    ['var(--fact)','Faktataulu'],['var(--dim)','Ulottuvuustaulu'],
    ['var(--metric)','Mittari'],['var(--ref)','Yleinen konsepti'],['var(--idx)','Indeksi / loki']
  ].map(([c,t])=>'<div><span class="sw" style="background:'+c+'"></span>'+t+'</div>').join('');
}
let tx=0, ty=0, tk=1;
function drawGraph(){
  const parts = ['<g transform="translate('+tx+','+ty+') scale('+tk+')">'];
  edges.forEach(([a,b]) => parts.push('<line x1="'+nodes[a].x.toFixed(1)+'" y1="'+
    nodes[a].y.toFixed(1)+'" x2="'+nodes[b].x.toFixed(1)+'" y2="'+nodes[b].y.toFixed(1)+
    '" stroke="#d8d2c8" stroke-width="0.8"/>'));
  nodes.forEach((n,i) => {
    const r = n.c.type === 'PostgreSQL Table' ? 7 : (n.c.reserved ? 3.5 : 5);
    parts.push('<circle data-i="'+i+'" cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+
      '" r="'+r+'" fill="'+colorOf(n.c)+'" stroke="#fff" stroke-width="1.5"><title>'+
      esc(n.c.title)+'</title></circle>');
    if(n.c.type === 'PostgreSQL Table' || (!n.c.reserved && n.c.type !== 'Metric'))
      parts.push('<text x="'+(n.x+10).toFixed(1)+'" y="'+(n.y+4).toFixed(1)+
        '" font-size="11" fill="#1c1a17">'+esc(n.c.table_name || n.c.title)+'</text>');
  });
  parts.push('</g>');
  svg.innerHTML = parts.join('');
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  tk *= f; tx = e.offsetX - (e.offsetX - tx)*f; ty = e.offsetY - (e.offsetY - ty)*f;
  drawGraph();
}, {passive:false});
let drag = null;
svg.addEventListener('mousedown', e => { drag = [e.clientX-tx, e.clientY-ty]; svg.style.cursor='grabbing'; });
window.addEventListener('mouseup', () => { drag = null; svg.style.cursor='grab'; });
window.addEventListener('mousemove', e => {
  if(!drag) return; tx = e.clientX-drag[0]; ty = e.clientY-drag[1]; drawGraph();
});
svg.addEventListener('click', e => {
  const t = e.target.closest('circle');
  if(!t) return;
  location.hash = nodes[+t.dataset.i].c.path;
  setTab('doc');
});

/* ---------- välilehdet ---------- */
function setTab(which){
  const g = which === 'graph';
  document.getElementById('graphwrap').classList.toggle('on', g);
  view.classList.toggle('hide', g);
  document.getElementById('tab-doc').classList.toggle('on', !g);
  document.getElementById('tab-graph').classList.toggle('on', g);
  if(g) buildGraph();
}
document.getElementById('tab-doc').onclick = () => setTab('doc');
document.getElementById('tab-graph').onclick = () => setTab('graph');

renderList('');
show(decodeURIComponent(location.hash.slice(1)) || '/index.md');
</script>
</body>
